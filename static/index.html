<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Agenten – Drag & Drop Layout</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* Forhindrer tekstselection under drag */
        }
        
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0f172a;
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 15px;
        }
        
        /* Header - fixed height */
        .header {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        
        h1 {
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Grid container - resizable */
        .grid-container {
            flex: 1;
            display: grid;
            gap: 15px;
            min-height: 0;
            transition: all 0.1s ease;
        }
        
        /* Panel styling */
        .panel {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 150px;
            min-height: 100px;
            position: relative;
        }
        
        .panel-header {
            background: #334155;
            padding: 10px 15px;
            cursor: move;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: #e2e8f0;
        }
        
        .panel-controls {
            display: flex;
            gap: 8px;
        }
        
        .panel-controls button {
            background: #475569;
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        
        .panel-controls button:hover {
            background: #64748b;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        /* Resize handle */
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 15px;
            height: 15px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, #60a5fa 50%);
            border-radius: 0 0 12px 0;
        }
        
        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, #a78bfa 50%);
        }
        
        /* Session bar */
        .session-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .session-select {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            color: #e2e8f0;
            flex: 1;
        }
        
        button {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover { background: #2563eb; }
        
        textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        
        .tree-container, .llm-box, .log-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .tree-node-content {
            padding: 4px 8px;
            margin: 2px 0;
            background: #1e293b;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }
        
        .tree-children { margin-left: 20px; }
        
        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .status-pending { background: #f59e0b; color: #0f172a; }
        .status-running { background: #3b82f6; }
        .status-done { background: #10b981; }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-bar {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 16px;
            transition: width 0.3s;
        }
        
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-left: 2px solid;
            font-size: 11px;
        }
        
        .log-INFO { border-left-color: #60a5fa; color: #93c5fd; }
        .log-DEBUG { border-left-color: #64748b; color: #94a3b8; }
        .log-ERROR { border-left-color: #ef4444; color: #fca5a5; }
        .log-LLM { border-left-color: #a78bfa; color: #c4b5fd; }
        
        /* Grid drag feedback */
        .grid-container.dragging {
            opacity: 0.6;
        }
        
        .panel.drag-over {
            border: 2px solid #60a5fa;
        }
        
        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
    <!-- GridStack.js for advanced layout -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🤖 Agenten – Drag & Drop Layout</h1>
        <p>Træk i paneler • Resize i hjørner • Layout gemmes per session</p>
        
        <div class="session-bar">
            <select id="sessionSelect" class="session-select">
                <option value="">-- Vælg eller opret ny session --</option>
            </select>
            <button onclick="createNewSession()">➕ Ny</button>
            <button onclick="loadSelectedSession()">📂 Indlæs</button>
            <button onclick="saveCurrentSession()">💾 Gem layout</button>
            <button onclick="resetLayout()">🔄 Reset layout</button>
        </div>
        
        <textarea id="promptInput" rows="2" placeholder="Indtast en opgave f.eks.:&#10;Hvordan ved jeg at 2 + 2 er 4?"></textarea>
        <div>
            <button onclick="decompose()">🌳 Nedbryd til træ</button>
            <button onclick="executeWithStream()" style="background:#10b981;">⚡ Udfør med streaming</button>
            <button onclick="stopStream()" style="background:#ef4444;">⏹️ Stop</button>
        </div>
    </div>
    
    <div class="grid-container" id="gridContainer"></div>
</div>

<script>
// Panel definitioner
const panels = [
    { id: 'tree', title: '📁 Opgavetræ', content: 'treeContainer', defaultWidth: 1, defaultHeight: 2 },
    { id: 'llm', title: '📡 LLM Output', content: 'llmStreamBox', defaultWidth: 1, defaultHeight: 2 },
    { id: 'log', title: '📋 Agent Log', content: 'logBox', defaultWidth: 2, defaultHeight: 1 }
];

let grid = null;
let currentSessionId = null;
let currentTree = null;
let eventSource = null;
let gridItems = {};

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addLogEntry(level, message, detail) {
    const logBox = document.getElementById('logBox');
    if (!logBox) return;
    const time = new Date().toLocaleTimeString();
    const logHtml = `<div class="log-entry log-${level}">
        <strong>[${time}] ${level}</strong>: ${escapeHtml(message)}<br>
        <span style="font-size: 10px; color: #64748b;">${escapeHtml(detail || '')}</span>
    </div>`;
    logBox.innerHTML += logHtml;
    logBox.scrollTop = logBox.scrollHeight;
}

function renderTree(node) {
    if (!node) return '';
    const statusClass = node.status === 'done' ? 'status-done' : (node.status === 'running' ? 'status-running' : 'status-pending');
    const statusText = node.status === 'done' ? '✓' : (node.status === 'running' ? '⏳' : '○');
    
    let html = `<div>
        <div class="tree-node-content">
            📌 ${escapeHtml(node.name)} <span class="task-status ${statusClass}">${statusText}</span>
        </div>`;
    
    if (node.children && node.children.length > 0) {
        html += `<div class="tree-children">`;
        for (const child of node.children) {
            html += renderTree(child);
        }
        html += `</div>`;
    }
    html += `</div>`;
    return html;
}

function updateTreeDisplay() {
    const treeContainer = document.getElementById('treeContainer');
    if (treeContainer && currentTree) {
        treeContainer.innerHTML = renderTree(currentTree);
    }
}

// Initialize GridStack
function initGrid(layout = null) {
    const container = document.getElementById('gridContainer');
    container.innerHTML = '';
    
    // Opret grid items
    for (const panel of panels) {
        const item = document.createElement('div');
        item.className = 'grid-stack-item';
        item.setAttribute('data-gs-id', panel.id);
        item.innerHTML = `
            <div class="grid-stack-item-content panel">
                <div class="panel-header" data-panel-id="${panel.id}">
                    <h3>${panel.title}</h3>
                    <div class="panel-controls">
                        <button onclick="toggleMinimize('${panel.id}')">−</button>
                        <button onclick="removePanel('${panel.id}')">×</button>
                    </div>
                </div>
                <div class="panel-content" id="${panel.content}">
                    <div style="color: #64748b;">Indhold for ${panel.title}</div>
                </div>
            </div>
        `;
        container.appendChild(item);
    }
    
    // Initialiser GridStack
    grid = GridStack.init({
        column: 12,
        cellHeight: '100px',
        margin: 15,
        float: false,
        animate: true,
        resizable: {
            handles: 'se'
        },
        draggable: {
            handle: '.panel-header',
            scroll: true
        }
    });
    
    // Load layout
    if (layout && layout.items) {
        grid.load(layout.items);
    } else {
        // Default layout
        grid.load([
            { id: 'tree', x: 0, y: 0, w: 4, h: 2 },
            { id: 'llm', x: 4, y: 0, w: 4, h: 2 },
            { id: 'log', x: 8, y: 0, w: 4, h: 2 }
        ]);
    }
    
    // Gem layout når noget ændres
    grid.on('change', function() {
        saveLayoutToSession();
    });
    
    gridItems = {};
    for (const panel of panels) {
        const el = document.querySelector(`[data-gs-id="${panel.id}"]`);
        if (el) gridItems[panel.id] = el;
    }
}

function getCurrentLayout() {
    if (!grid) return null;
    const items = grid.save(false);
    return { items: items };
}

async function saveLayoutToSession() {
    if (!currentSessionId) return;
    const layout = getCurrentLayout();
    if (layout) {
        const response = await fetch('/api/sessions/save-layout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSessionId, layout: layout })
        });
        const data = await response.json();
        if (data.success) {
            console.log('Layout gemt');
        }
    }
}

function resetLayout() {
    if (grid) {
        grid.load([
            { id: 'tree', x: 0, y: 0, w: 4, h: 2 },
            { id: 'llm', x: 4, y: 0, w: 4, h: 2 },
            { id: 'log', x: 8, y: 0, w: 4, h: 2 }
        ]);
        saveLayoutToSession();
    }
}

function toggleMinimize(panelId) {
    const item = gridItems[panelId];
    if (item) {
        const node = grid.getCellFromPixel(item);
        const currentH = node.h;
        if (currentH > 1) {
            grid.resize(item, node.w, 1);
        } else {
            grid.resize(item, node.w, 2);
        }
    }
}

function removePanel(panelId) {
    const item = gridItems[panelId];
    if (item) {
        grid.removeWidget(item);
        delete gridItems[panelId];
        saveLayoutToSession();
    }
}

// Session management
async function refreshSessions() {
    const response = await fetch('/api/sessions');
    const data = await response.json();
    if (data.success) {
        const select = document.getElementById('sessionSelect');
        select.innerHTML = '<option value="">-- Vælg eller opret ny session --</option>';
        for (const session of data.sessions) {
            select.innerHTML += `<option value="${session.id}">${escapeHtml(session.name)} (${session.task_count} opgaver)</option>`;
        }
    }
}

async function createNewSession() {
    const name = prompt('Navn på ny session:', `Session ${new Date().toLocaleTimeString()}`);
    if (name) {
        const response = await fetch('/api/sessions/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (data.success) {
            currentSessionId = data.session_id;
            addLogEntry('INFO', 'Ny session oprettet', `${name} (${data.session_id})`);
            refreshSessions();
            resetLayout();
        }
    }
}

async function loadSelectedSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert('Vælg en session');
        return;
    }
    const response = await fetch(`/api/sessions/load/${sessionId}`);
    const data = await response.json();
    if (data.success) {
        currentSessionId = sessionId;
        
        // Load layout
        if (data.session.layout && grid) {
            grid.load(data.session.layout.items);
        }
        
        // Load tree
        if (data.session.tree) {
            currentTree = data.session.tree;
            updateTreeDisplay();
        }
        
        // Load log
        if (data.session.agent_log) {
            const logBox = document.getElementById('logBox');
            if (logBox) {
                logBox.innerHTML = '';
                for (const log of data.session.agent_log) {
                    logBox.innerHTML += `<div class="log-entry log-${log.level}">
                        <strong>[${new Date(log.timestamp * 1000).toLocaleTimeString()}] ${log.level}</strong>: ${escapeHtml(log.message)}<br>
                        <span style="font-size: 10px;">${escapeHtml(log.detail || '')}</span>
                    </div>`;
                }
            }
        }
        
        addLogEntry('INFO', 'Session indlæst', data.session.name);
    }
}

async function saveCurrentSession() {
    if (!currentSessionId) {
        await createNewSession();
    }
    const layout = getCurrentLayout();
    const response = await fetch('/api/sessions/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            session_id: currentSessionId,
            name: document.getElementById('promptInput').value.slice(0, 30),
            tree: currentTree,
            layout: layout
        })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', 'Session gemt', currentSessionId);
        refreshSessions();
    }
}

// Agent functions
async function decompose() {
    const prompt = document.getElementById('promptInput').value;
    if (!prompt) {
        alert('Indtast en opgave');
        return;
    }
    
    addLogEntry('INFO', 'Starter nedbrydning', prompt.slice(0, 50));
    
    const response = await fetch('/api/decompose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, session_id: currentSessionId })
    });
    const data = await response.json();
    
    if (data.success) {
        currentTree = data.tree;
        currentSessionId = data.session_id;
        updateTreeDisplay();
        addLogEntry('INFO', 'Nedbrydning færdig', `${data.session_id}`);
        
        if (data.log) {
            for (const log of data.log) {
                addLogEntry(log.level, log.message, log.detail);
            }
        }
        refreshSessions();
        await saveCurrentSession();
    } else {
        addLogEntry('ERROR', 'Nedbrydning fejlede', data.error);
    }
}

function stopStream() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    addLogEntry('INFO', 'Streaming stoppet', 'Af bruger');
}

function executeWithStream() {
    if (!currentTree) {
        alert('Nedbryd en opgave først');
        return;
    }
    
    stopStream();
    
    const llmBox = document.getElementById('llmStreamBox');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    document.getElementById('progressContainer').style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', 'Kontekst modtaget', data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${data.total_tasks} opgaver</div>`;
                addLogEntry('INFO', 'Streaming startet', `${data.total_tasks} opgaver`);
                break;
                
            case 'task_start':
                if (llmBox) {
                    document.getElementById('currentTask').innerHTML = `📌 ${escapeHtml(data.task)} <span class="loading"></span>`;
                }
                function markRunning(node) {
                    if (node.name === data.task) node.status = 'running';
                    if (node.children) node.children.forEach(markRunning);
                }
                if (currentTree) {
                    markRunning(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Påbegynder opgave', data.task);
                break;
                
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                const outputDiv = document.getElementById(outputId);
                if (outputDiv) {
                    outputDiv.innerHTML = escapeHtml(currentOutputs[data.task]);
                }
                if (llmBox) llmBox.scrollTop = llmBox.scrollHeight;
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                if (llmBox) {
                    document.getElementById('currentTask').innerHTML = `<span style="color:#10b981;">✓ ${escapeHtml(data.task)} færdig</span>`;
                }
                function markDone(node) {
                    if (node.name === data.task) node.status = 'done';
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Opgave færdig', data.task);
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:#10b981; margin-top: 15px;">✅ Alle opgaver færdige!</div>`;
                document.getElementById('progressContainer').style.display = 'none';
                addLogEntry('INFO', 'Streaming færdig', 'Alle opgaver udført');
                saveCurrentSession();
                eventSource.close();
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:#ef4444;">❌ Fejl: ${data.message}</div>`;
                addLogEntry('ERROR', 'Streaming fejl', data.message);
                eventSource.close();
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Forsøger at genoprette...');
    };
}

// Create progress container if not exists
function ensureProgressContainer() {
    if (!document.getElementById('progressContainer')) {
        const llmBox = document.getElementById('llmStreamBox');
        if (llmBox && llmBox.parentNode) {
            const progressDiv = document.createElement('div');
            progressDiv.id = 'progressContainer';
            progressDiv.style.display = 'none';
            progressDiv.innerHTML = `
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <div id="currentTask" style="margin-bottom: 8px; font-size: 12px;"></div>
            `;
            llmBox.parentNode.insertBefore(progressDiv, llmBox);
        }
    }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', function() {
    initGrid();
    ensureProgressContainer();
    refreshSessions();
    
    // Fill default content
    const treeContainer = document.getElementById('treeContainer');
    if (treeContainer) treeContainer.innerHTML = '<div style="color: #64748b;">Klik "Nedbryd til træ"</div>';
    
    const llmBox = document.getElementById('llmStreamBox');
    if (llmBox) llmBox.innerHTML = '<div style="color: #64748b;">Tryk "Udfør med streaming"</div>';
    
    const logBox = document.getElementById('logBox');
    if (logBox) logBox.innerHTML = '<div style="color: #64748b;">Logger venter på aktivitet...</div>';
});
</script>
</body>
</html>
