async function resetExecution() {
    if (!currentTree) {
        alert(_('no_tree_to_reset'));
        return;
    }
    if (!confirm(_('confirm_reset'))) return;
    
    await fetch('/api/reset-execution', { method: 'POST' });
    
    function resetStatus(node) {
        node.status = 'pending';
        node.result = null;
        if (node.children) {
            node.children.forEach(child => resetStatus(child));
        }
    }
    resetStatus(currentTree);
    
    updateTreeDisplay();
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', _('tree_reset'), '');
    
    if (currentSessionId) saveCurrentSession();
}

async function deleteTree() {
    if (!currentTree) {
        alert(_('no_tree_to_delete'));
        return;
    }
    if (!confirm(_('confirm_delete_tree'))) {
        return;
    }
    currentTree = null;
    await fetch('/api/reset-execution', { method: 'POST' });
    const treeContainer = document.getElementById('treeContainer');
    if (treeContainer) treeContainer.innerHTML = `<div style="color:#64748b;">${_('click_tree_hint')}</div>`;
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', _('tree_deleted'), '');
    await saveCurrentSession();
}

let lastDecomposeTemplate = null;

async function executeWithStream() {
    const template = document.getElementById('templateSelect').value;
    if (!currentTree || (template !== 'fri' && template !== lastDecomposeTemplate)) {
        await decompose();
        if (!currentTree) return;
    }
    
    // Create git backup before execution — show undo button
    try {
        const resp = await fetch('/api/git/backup', { method: 'POST' });
        const backup = await resp.json();
        if (backup.success) {
            const undoBtn = document.getElementById('undoBtn');
            if (undoBtn) {
                undoBtn.style.display = 'inline-block';
                undoBtn.disabled = false;
                undoBtn.textContent = '↶ Fortryd';
            }
        }
    } catch(e) {
        addLogEntry('WARNING', 'Backup fejlede', e.message);
    }
    
    stopStream();
    
    // Save current tree state before execution
    await saveCurrentSession();
    
    document.getElementById('replyInput').style.display = 'inline-block';
    document.getElementById('replyBtn').style.display = 'inline-block';
    
    const llmBox = document.getElementById('llmContent');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    const progressContainer = document.getElementById('progressContainer');
    if (progressContainer) progressContainer.style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', _('context_received'), data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${_('N_tasks').replace('{n}', data.total_tasks)}</div>`;
                addLogEntry('INFO', _('streaming_started'), _('N_tasks').replace('{n}', data.total_tasks));
                break;

            case 'retry':
                addLogEntry('WARNING', `🔄 Genforsøg ${data.attempt}/${data.max} for "${data.task}"`, '');
                const retryTask = document.getElementById('currentTask');
                if (retryTask) retryTask.innerHTML = `📌 ${escapeHtml(data.task)} <span style="color:#f59e0b;">🔄 forsøg ${data.attempt}/${data.max}</span>`;
                break;

            case 'task_start':
                 const currentTask = document.getElementById('currentTask');
                 let taskHtml = `📌 ${escapeHtml(data.task)}`;
                 if (data.success_criteria && data.success_criteria.length > 0) {
                     const criteriaList = data.success_criteria.map(c => `• ${escapeHtml(c)}`).join(' ');
                     taskHtml += `<div class="task-criteria" style="font-size: 0.8em; opacity: 0.7; margin-top: 2px;">${criteriaList}</div>`;
                 }
                 taskHtml += ` <span class="loading"></span>`;
                 if (currentTask) currentTask.innerHTML = taskHtml;
                 
                 function markRunning(node) {
                     if (node.name === data.task) node.status = 'running';
                     if (node.children) node.children.forEach(markRunning);
                 }
                 if (currentTree) {
                     markRunning(currentTree);
                     updateTreeDisplay();
                 }
                 addLogEntry('INFO', _('task_started'), data.task);
                 break;
                
            case 'progress_chunk':
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                let clean = currentOutputs[data.task];
                clean = clean.replace(/<think>[\s\S]*?<\/think>/g, '');
                clean = stripHarmony(clean);
                if (showThinking) {
                    const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                    const outputDiv = document.getElementById(outputId);
                    if (outputDiv) {
                        outputDiv.textContent = clean;
                    }
                }
                if (llmBox && llmBox.scrollTop + llmBox.clientHeight >= llmBox.scrollHeight - 60) {
                    llmBox.scrollTop = llmBox.scrollHeight;
                }
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                const taskElem = document.getElementById('currentTask');
                const isFail = data.status === 'failed';
                const isSkipped = data.status === 'skipped';
                const doneColor = isFail ? 'var(--error, #ef4444)' : (isSkipped ? '#f59e0b' : 'var(--success)');
                const doneIcon = isFail ? '✗' : (isSkipped ? '⏭' : '✓');
                const doneEmoji = isFail ? '❌' : (isSkipped ? '⏭️' : '✅');
                const msgLabel = isFail ? (_('task_failed_label') || 'Opgaver fejlede') : (isSkipped ? 'Opgave sprunget over' : _('task_done_label'));
                if (taskElem) taskElem.innerHTML = `<span style="color:${doneColor};">${doneIcon} ${escapeHtml(data.task)} ${isFail ? 'fejlede' : (isSkipped ? 'sprunget over' : 'færdig')}</span>`;
                
                if (llmBox) {
                    const output = stripHarmony(currentOutputs[data.task] || data.result || '');
                    const existing = llmBox.querySelector(`[data-task="${data.task}"]`);
                    const borderColor = isFail ? 'var(--error, #ef4444)' : (isSkipped ? '#f59e0b' : 'var(--success)');
                    const resultDiv = `<div style="white-space:pre-wrap;margin-top:5px;padding:8px;background:var(--input-bg);border-radius:6px;border-left:3px solid ${borderColor};">${escapeHtml(output)}</div>`;
                    if (existing) {
                        existing.innerHTML += `<div style="margin-top:8px;"><strong style="color:${doneColor};">${doneEmoji} ${isFail ? 'Fejl' : (isSkipped ? 'Sprunget over' : 'Resultat')}</strong>${resultDiv}</div>`;
                    } else {
                        llmBox.innerHTML += `<div data-task="${data.task}" style="margin-bottom:15px;"><strong style="color:${doneColor};">${doneEmoji} ${escapeHtml(data.task)}</strong>${resultDiv}</div>`;
                    }
                }
                
                function markDone(node) {
                    if (node.name === data.task) node.status = isFail ? 'failed' : (isSkipped ? 'skipped' : 'done');
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry(isFail ? 'ERROR' : 'INFO', msgLabel, data.task);
                saveCurrentSession();
                break;
                
            case 'tool_call':
                addLogEntry('TOOL', `🔧 ${data.tool}`, JSON.stringify(data.args));
                break;
                
            case 'tool_result':
                const success = data.result?.success;
                const icon = success ? '✅' : '❌';
                const rtext = JSON.stringify(data.result, null, 2);
                addLogEntry(success ? 'TOOL' : 'ERROR', `${icon} ${data.tool}`, rtext.length > 500 ? rtext.slice(0, 500) + '…' : rtext);
                if (llmBox && success) {
                    llmBox.innerHTML += `<div style="color:var(--success); margin:5px 0; padding:5px; background:var(--panel-bg); border-left:3px solid var(--success); font-size:12px;">${icon} <strong>${escapeHtml(data.tool)}</strong>: ${escapeHtml(data.result.result?.url || data.result.result?.output || 'OK').slice(0, 150)}</div>`;
                    if (llmBox.scrollTop + llmBox.clientHeight >= llmBox.scrollHeight - 60) {
                        llmBox.scrollTop = llmBox.scrollHeight;
                    }
                }
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:var(--success); margin-top: 15px;">${_('all_done')}</div>`;
                if (progressContainer) progressContainer.style.display = 'none';
                addLogEntry('INFO', _('stream_done'), _('all_executed'));
                saveCurrentSession();
                updatePromptHistory(currentSessionId);
                eventSource.close();
                document.getElementById('replyInput').style.display = 'none';
                document.getElementById('replyBtn').style.display = 'none';
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:var(--danger);">❌ ${_('error_prefix')}${data.message}</div>`;
                addLogEntry('ERROR', _('stream_error'), data.message);
                eventSource.close();
                document.getElementById('replyInput').style.display = 'none';
                document.getElementById('replyBtn').style.display = 'none';
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Genopretter...');
    };
}

function stripHarmony(text) {
    if (!text) return text;
    // Remove entire analysis channel blocks (private reasoning)
    text = text.replace(/<\|channel\|>analysis<\|message\|>[\s\S]*?<\|end\|>/g, '');
    // Remove entire commentary channel blocks (internal tool chatter)
    text = text.replace(/<\|channel\|>commentary[^<]*<\|message\|>[\s\S]*?<\|end\|>/g, '');
    // Remove all remaining Harmony format tokens: <|channel|>, <|message|>, <|start|>, <|end|>, <|return|>, <|call|>, <|constrain|>, <|"|>
    text = text.replace(/<\|[^|]+\|>/g, '');
    // Clean up excessive whitespace
    text = text.replace(/\n{3,}/g, '\n\n').trim();
    return text;
}

function generateTreeMarkdown(node, level = 0) {
    if (!node) return '';
    
    const indent = '  '.repeat(level);
    const statusIcon = node.status === 'done' ? '✅' : (node.status === 'running' ? '🔄' : '⏳');
    let md = `${indent}- ${statusIcon} **${node.name}**\n`;
    
    if (node.children && node.children.length > 0) {
        for (const child of node.children) {
            md += generateTreeMarkdown(child, level + 1);
        }
    }
    
    return md;
}

    md += `- \n`;
    md += `- \n\n`;

    const filename = `agent_session_${currentSessionId}_${Date.now()}.md`;
    
    const saveResponse = await fetch('/api/folder/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

    });
    const saveData = await saveResponse.json();
    
    if (saveData.success) {
        addLogEntry('INFO', _('exported_to'), saveData.filepath);

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addLogEntry('INFO', _('downloaded'), filename);
    }
}

let issuesData = [];
let issuesSort = { column: null, dir: 'asc' };
let issuesFilter = '';

function sortIssues(col) {
    if (issuesSort.column === col) {
        issuesSort.dir = issuesSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
        issuesSort.column = col;
        issuesSort.dir = 'asc';
    }
    renderIssuesTable();
}

function joinIssueValues(value) {
    if (!value) return '';
    return Array.isArray(value) ? value.join(', ') : String(value);
}

function issueSearchText(issue) {
    return ['id','title','type','status','severity','description','context','symptoms','action','location','impact','proposed_fix','acceptance_criteria','tags','affected_files']
        .map(k => joinIssueValues((issue || {})[k]))
        .join(' ')
        .toLowerCase();
}

function normalizeIssueList(issues) {
    return (issues || []).map(issue => {
        const normalized = {...issue};
        if (!normalized.description && normalized.context) normalized.description = normalized.context;
        if (!normalized.location) normalized.location = joinIssueValues(normalized.affected_files);
        if (!normalized.proposed_fix) normalized.proposed_fix = normalized.action || '';
        if (!normalized.acceptance_criteria) normalized.acceptance_criteria = normalized.prevention_test || '';
        if (!normalized.category) normalized.category = normalized.type || '';
        return normalized;
    });
}

function renderIssuesTable() {
    const content = document.getElementById('issuesContent');
    let filtered = issuesData;
    if (issuesFilter) {
        const f = issuesFilter.toLowerCase();
        filtered = issuesData.filter(issue => issueSearchText(issue).includes(f));
    }
    const col = issuesSort.column;
    if (col) {
        const d = issuesSort.dir === 'asc' ? 1 : -1;
        filtered.sort((a, b) => {
            const va = joinIssueValues(a[col]).toLowerCase();
            const vb = joinIssueValues(b[col]).toLowerCase();
            return va < vb ? -d : va > vb ? d : 0;
        });
    }
    if (!filtered.length) {
        content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">' + _('issues_none') + '</div>';

    const arrow = c => issuesSort.column === c ? (issuesSort.dir === 'asc' ? ' &#9650;' : ' &#9660;') : '';

        <th onclick="sortIssues('id')" style="cursor:pointer;user-select:none;">ID${arrow('id')}</th>

            <td><span class="${statusClass}">${estatus}</span></td>
            <td><span class="${sevClass}">${eseverity}</span></td>
            <td><button onclick="event.stopPropagation();useIssueAsTask('${issueEnc}')" style="background:var(--accent);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap;" title="${_('use_as_task')}">${_('issues_run')}</button></td>
            <td><button onclick="event.stopPropagation();deleteIssue('${eid}')" style="background:var(--danger);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;" title="${_('issues_delete_title')}">${_('issues_delete')}</button></td>
        </tr>`;
    }
    html += '</tbody></table>';
    content.innerHTML = html;
}

function showNewIssueForm() {
    const form = document.getElementById('newIssueForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
    if (form.style.display === 'block') {
        document.getElementById('ni_title').focus();
    }
}

function cancelNewIssue() {
    document.getElementById('newIssueForm').style.display = 'none';
    document.getElementById('ni_status').textContent = '';
}

async function createNewIssue() {
    const title = document.getElementById('ni_title').value.trim();
    if (!title) { document.getElementById('ni_status').textContent = '⚠️ Titel er påkrævet'; return; }
    const statusEl = document.getElementById('ni_status');
    statusEl.textContent = '⏳ Gemmer...';
    try {
        const resp = await fetch('/api/issues', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title,
                type: document.getElementById('ni_type').value,
                severity: document.getElementById('ni_severity').value,
                location: document.getElementById('ni_location').value.trim(),
                description: document.getElementById('ni_description').value.trim(),
                acceptance_criteria: document.getElementById('ni_acceptance').value.trim(),
                impact: 'Active stability risk that needs regression coverage before marking stable.',
                proposed_fix: 'Undersøg roden og implementér forebyggende test.',
            }),
        });
        const data = await resp.json();
        if (data.success) {
            statusEl.textContent = `✅ ${data.issue.id} oprettet`;
            document.getElementById('ni_title').value = '';
            document.getElementById('ni_location').value = '';
            document.getElementById('ni_description').value = '';
            document.getElementById('ni_acceptance').value = '';
            showIssuesPanel(); // refresh
        } else {
            statusEl.textContent = `❌ ${data.error || 'Fejl'}`;
        }
    } catch(e) {
        document.getElementById('ni_status').textContent = `❌ ${e.message}`;
    }
}

function showIssuesPanel() {
    const modal = document.getElementById('issuesModal');
    const content = document.getElementById('issuesContent');
    const filterBar = document.getElementById('issuesFilterBar');
    const filterInput = document.getElementById('issuesFilterInput');
    document.getElementById('issuesModalTitle').textContent = _('issues_title');
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">' + _('loading') + '</div>';
    filterBar.style.display = 'block';
    filterInput.value = '';
    modal.style.display = 'flex';
    // Load autoresearch status
    fetch('/api/autoresearch/status')
        .then(r => r.json())
        .then(s => updateARButton(s.autoresearch_enabled))
        .catch(() => {});
    fetch('/api/issues')
        .then(r => r.json())
        .then(data => {
            issuesData = normalizeIssueList(data.all_issues || data.issues || []);
            issuesSort = { column: null, dir: 'asc' };
            issuesFilter = '';
            renderIssuesTable();
            filterInput.focus();
        })
        .catch(e => {
            filterBar.style.display = 'none';
            content.innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger);">${_('issues_error')}: ${e.message}</div>`;
        });
}

document.addEventListener('input', function(e) {
    if (e.target.id === 'issuesFilterInput') {
        issuesFilter = e.target.value;
        renderIssuesTable();
    }
});

function closeIssuesPanel() {
    document.getElementById('issuesModal').style.display = 'none';
}

async function toggleAutoResearch() {
    try {
        const resp = await fetch('/api/autoresearch/status');
        const status = await resp.json();
        const currently = status.autoresearch_enabled;
        const toggle = await fetch('/api/autoresearch/toggle', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({enabled: !currently}),
        });
        const result = await toggle.json();
        updateARButton(result.autoresearch_enabled);
        addLogEntry('INFO', `Auto-research ${result.autoresearch_enabled ? 'aktiveret' : 'deaktiveret'}`, '');
    } catch(e) {
        console.warn('Auto-research toggle fejlede:', e);
    }
}

function updateARButton(enabled) {
    const btn = document.getElementById('arToggleBtn');
    if (enabled) {
        btn.textContent = '🔬 ON';
        btn.style.background = 'var(--accent)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--accent)';
    } else {
        btn.textContent = '🔬';
        btn.style.background = 'var(--btn-secondary)';
        btn.style.color = 'var(--text-muted)';
        btn.style.borderColor = 'var(--border)';
    }
}

function toggleIssueDetail(row) {
    const detail = row.querySelector('.issue-detail');
    if (detail) detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
}

async function useIssueAsTask(encoded) {
    const issue = JSON.parse(decodeURIComponent(encoded));
    closeIssuesPanel();
    const prompt = document.getElementById('promptInput');
    const template = document.getElementById('templateSelect');
    const templateLabel = document.getElementById('templateLabel');
    const promptText = `${issue.id}: ${issue.title}\n\n${issue.description || ''}\n\n${_('issues_detail_location')} ${issue.location || '—'}\n${_('issues_detail_impact')} ${issue.impact || '—'}\n\n${_('issues_detail_fix')} ${issue.proposed_fix || '—'}`;
    prompt.value = promptText;
    const tplMap = { 'architecture': 'refactor', 'bug': 'bugfix', 'self': 'selvforbedring' };
    template.value = tplMap[issue.type] || 'issue_handler';
    addLogEntry('INFO', `${_('prompt_filled_from')} ${issue.id}`, issue.title);

    selectedFiles = [];
    loadedFilesContent = [];
    document.getElementById('selectedFilesDisplay').innerHTML = '';
    document.getElementById('fileContentPreview').innerHTML = '';
    document.getElementById('fileContentPreview').style.display = 'none';

    const fileMatches = issue.location ? [...issue.location.matchAll(/([\w./-]+\.\w+)/g)] : [];
    let firstLoaded = false;
    for (const m of fileMatches) {
        try {
            const resp = await fetch('/api/file/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filepath: m[1] })
            });
            const data = await resp.json();
            if (data.success) {
                loadedFilesContent.push({
                    filename: data.filename,
                    filepath: data.filepath,
                    content: data.content,
                    included: true
                });
                if (!firstLoaded) {
                    document.getElementById('filePathInput').value = data.filename;
                    firstLoaded = true;
                }
                addLogEntry('INFO', `Fil indlæst: ${data.filename}`, `${data.lines} linjer`);
            }
        } catch(e) {
            addLogEntry('WARNING', 'Kunne ikke auto-indlæse fil', m[1]);
        }
    }
}

async function deleteIssue(issueId) {
    if (!confirm(_('issues_delete_confirm').replace('{id}', issueId))) return;
    try {
        const resp = await fetch(`/api/issues/${issueId}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.success) {
            addLogEntry('INFO', `Issue ${issueId} slettet`, '');
            showIssuesPanel();
        } else {
            addLogEntry('ERROR', `Kunne ikke slette ${issueId}`, data.error);
        }
    } catch (e) {
        addLogEntry('ERROR', `Fejl ved sletning`, e.message);
    }
}

    createPanels();
    loadTemplates();
    refreshSessions();
    checkFolderStatus();
    checkWorkdirStatus();
    try {
        if (localStorage.getItem('agenten_header_collapsed') === '1') {
            document.querySelector('.header').classList.add('collapsed');
            document.getElementById('headerCollapseBtn').textContent = '▼';
        }
    } catch(e) {}
});
