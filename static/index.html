<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Agenten</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --panel-header: #334155;
            --btn-secondary: #475569;
            --btn-secondary-hover: #64748b;
            --input-bg: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-start: #f59e0b;
            --gradient-end: #fbbf24;
            --scrollbar-track: #1e293b;
            --scrollbar-thumb: #475569;
            --scrollbar-thumb-hover: #64748b;
            --shadow: rgba(0,0,0,0.3);
            --shadow-drag: rgba(0,0,0,0.5);
            --log-info-border: #60a5fa;
            --log-info-text: #93c5fd;
            --log-debug-border: #64748b;
            --log-debug-text: #94a3b8;
            --log-error-text: #fca5a5;
            --log-llm-border: #a78bfa;
            --log-llm-text: #c4b5fd;
            --history-border: #60a5fa;
            --resize-color: #60a5fa;
            --resize-hover: #a78bfa;
            --purple-accent: #8b5cf6;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --panel-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --panel-header: #f1f5f9;
            --btn-secondary: #e2e8f0;
            --btn-secondary-hover: #cbd5e1;
            --input-bg: #ffffff;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --gradient-start: #d97706;
            --gradient-end: #f59e0b;
            --scrollbar-track: #f1f5f9;
            --scrollbar-thumb: #cbd5e1;
            --scrollbar-thumb-hover: #94a3b8;
            --shadow: rgba(0,0,0,0.1);
            --shadow-drag: rgba(0,0,0,0.2);
            --log-info-border: #3b82f6;
            --log-info-text: #1d4ed8;
            --log-debug-border: #94a3b8;
            --log-debug-text: #64748b;
            --log-error-text: #b91c1c;
            --log-llm-border: #7c3aed;
            --log-llm-text: #6d28d9;
            --history-border: #3b82f6;
            --resize-color: #3b82f6;
            --resize-hover: #6366f1;
            --purple-accent: #7c3aed;
        }

        /* Rendered Markdown in preview */
        .rendered-markdown h1 { font-size: 24px; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-top: 0; }
        .rendered-markdown h2 { font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 24px; }
        .rendered-markdown h3 { font-size: 15px; margin-top: 18px; }
        .rendered-markdown code { background: var(--input-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .rendered-markdown pre { background: var(--input-bg); padding: 14px; border-radius: 8px; overflow-x: auto; }
        .rendered-markdown pre code { background: none; padding: 0; }
        .rendered-markdown ul, .rendered-markdown ol { padding-left: 24px; }
        .rendered-markdown li { margin: 4px 0; }
        .rendered-markdown table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .rendered-markdown th, .rendered-markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .rendered-markdown th { background: var(--panel-header); }
        .rendered-markdown blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-muted); margin: 12px 0; }
        .rendered-markdown a { color: var(--accent); }
        .rendered-markdown hr { border-color: var(--border); }
        .rendered-markdown img { max-width: 100%; border-radius: 8px; }

        * { box-sizing: border-box; }
        button, input, select, label, .reuse-btn, .tools-toggle, .panel-controls { user-select: none; }
        .tree-container, .llm-box, .log-box, .history-box, .file-preview,
        .tree-node-content, .history-item, .history-result, .history-prompt,
        #currentTask, #progressContainer {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
        }
        
        body {
            font-family: 'Segoe UI', system-ui;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 15px;
        }
        
        .header {
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 16px;
            text-align: left;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        
        h1 {
            margin: 0;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        
        .theme-toggle {
            background: var(--btn-secondary);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
            transition: background 0.2s;
        }
        .theme-toggle:hover { background: var(--btn-secondary-hover); }
        
        .session-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .session-select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            color: var(--text);
            flex: 1;
        }
        
        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        
        .toolbar-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 70px;
            flex-shrink: 0;
        }
        
        .tools-toggle {
            background: var(--btn-secondary);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            position: relative;
        }
        
        .tools-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            z-index: 1000;
            min-width: 200px;
            flex-direction: column;
            gap: 4px;
        }
        
        .tools-dropdown.show { display: flex; }
        
        .tools-dropdown button {
            width: 100%;
            text-align: left;
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .tools-wrapper {
            position: relative;
            display: inline-block;
        }
        
        button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        button:hover { background: var(--accent-hover); }
        
        textarea {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            background: var(--bg);
            border-radius: 16px;
            overflow: auto;
            min-height: 0;
            transition: background 0.3s;
        }
        
        .panel {
            position: absolute;
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
            min-width: 200px;
            min-height: 150px;
            transition: background 0.3s, border-color 0.3s;
        }
        
        .panel.dragging {
            opacity: 0.8;
            cursor: grabbing;
            box-shadow: 0 8px 30px var(--shadow-drag);
            z-index: 1000;
        }
        
        .panel-header {
            background: var(--panel-header);
            padding: 10px 15px;
            cursor: grab;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        
        .panel-header:active { cursor: grabbing; }
        
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text);
        }
        
        .drag-icon {
            cursor: grab;
            margin-right: 8px;
            opacity: 0.6;
            font-size: 16px;
        }
        .drag-icon:active { cursor: grabbing; }
        
        .panel-controls { display: flex; gap: 8px; }
        
        .panel-controls button {
            background: var(--btn-secondary);
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
        }
        .panel-controls button:hover { background: var(--btn-secondary-hover); }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, var(--resize-color) 50%);
            border-radius: 0 0 12px 0;
            z-index: 10;
        }
        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, var(--resize-hover) 50%);
        }
        
        .tree-container, .llm-box, .log-box, .history-box {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .tree-node-content {
            padding: 4px 8px;
            margin: 2px 0;
            background: var(--panel-bg);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }
        
        .tree-children { margin-left: 20px; }
        
        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .status-pending { background: var(--warning); color: #0f172a; }
        .status-running { background: var(--accent); color: white; }
        .status-done { background: var(--success); color: white; }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-bar {
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            background: var(--accent);
            width: 0%;
            height: 16px;
            transition: width 0.3s;
        }
        
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-left: 2px solid;
            font-size: 11px;
        }
        
        .log-INFO { border-left-color: var(--log-info-border); color: var(--log-info-text); }
        .log-DEBUG { border-left-color: var(--log-debug-border); color: var(--log-debug-text); }
        .log-ERROR { border-left-color: var(--danger); color: var(--log-error-text); }
        .log-LLM { border-left-color: var(--log-llm-border); color: var(--log-llm-text); }
        
        .history-item {
            background: var(--panel-bg);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
            border-left: 3px solid var(--history-border);
        }
        
        .history-prompt {
            font-weight: bold;
            color: var(--history-border);
            margin-bottom: 5px;
        }
        
        .history-result {
            font-size: 11px;
            color: var(--log-info-text);
            margin-top: 5px;
        }
        
        .reuse-btn {
            margin-top: 5px;
            font-size: 10px;
            padding: 2px 8px;
            background: var(--btn-secondary);
        }
        
        .folder-status {
            display: inline-block;
            background: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 10px;
            color: white;
        }
        
        .file-preview {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
        }
        
        .file-preview pre { text-align: left; margin: 0; }
        
        .toolbar-select, .lang-select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            color: var(--text);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        
        .thinking-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--purple-accent);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .template-warning {
            background: var(--warning);
            color: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 8px;
            white-space: pre-wrap;
        }
        [data-theme="light"] .template-warning {
            color: #0f172a;
        }
        .template-warning-close {
            float: right;
            cursor: pointer;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0,0,0,0.15);
        }
        .template-warning-close:hover {
            background: rgba(0,0,0,0.3);
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        /* Issues modal */
        .issues-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .issues-modal {
            background: var(--panel-bg); border-radius: 12px;
            width: 90%; max-width: 900px; max-height: 80vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px var(--shadow);
        }
        .issues-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--border);
        }
        .issues-header h2 { margin: 0; font-size: 18px; }
        .issues-close {
            background: var(--btn-secondary); border: none;
            padding: 6px 12px; border-radius: 6px; color: var(--text);
            cursor: pointer; font-size: 14px;
        }
        .issues-table {
            width: 100%; border-collapse: collapse; font-size: 12px;
        }
        .issues-table th {
            text-align: left; padding: 8px 12px;
            border-bottom: 2px solid var(--border);
            background: var(--panel-header); position: sticky; top: 0;
        }
        .issues-table td {
            padding: 6px 12px; border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .issues-table tr:hover { background: var(--input-bg); }
        .issues-scroll { overflow-y: auto; flex: 1; padding: 8px; }
        .issue-severity-critical { color: var(--danger); font-weight: bold; }
        .issue-severity-high { color: var(--warning); font-weight: bold; }
        .issue-severity-medium { color: var(--accent); }
        .issue-severity-low { color: var(--text-muted); }
        .issue-status-open { color: var(--danger); }
        .issue-status-resolved { color: var(--success); }
        .issue-type { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; }
        .issue-type-bug { background: var(--danger); color: white; }
        .issue-type-security { background: var(--warning); color: #0f172a; }
        .issue-type-architecture { background: var(--purple-accent); color: white; }
        .issue-type-testing { background: var(--accent); color: white; }
        .issue-type-performance { background: #06b6d4; color: white; }
        .issue-type-maintainability { background: var(--text-muted); color: white; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <h1>🤖 Agenten</h1>
<div class="tools-wrapper">
                <button class="tools-toggle" onclick="toggleTools()" id="toolsMenu" title="Flere værktøjer">⚙️</button>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Skift tema">☀️</button>
                <div class="tools-dropdown" id="toolsDropdown">
                    <label style="display:flex;align-items:center;gap:8px;padding:4px 8px;cursor:pointer;white-space:nowrap;">
                        <input type="checkbox" id="thinkingToggle" onchange="toggleThinkingMode()">
                        <span id="thinkingLabel">Vis tænkning</span>
                    </label>
                    <select id="langSelect" onchange="switchLang(this.value)" style="width:100%;padding:4px;margin:4px 0;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:4px;">
                        <option value="da">🇩🇰 Dansk</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="zh">🇨🇳 中文</option>
                    </select>
                    <hr style="border-color:var(--border);margin:4px 0;">
                    <button onclick="resetExecution()" id="resetTreeBtn" title="Nulstil alle opgavers status">🔄 Nulstil træ</button>
                    <button onclick="deleteTree()" id="deleteTreeBtn" title="Slet hele opgavetræet">🗑 Slet træ</button>
                    <button onclick="previewMarkdown()" id="previewBtn" title="Forhåndsvis session">👁 Preview</button>
                    <button onclick="exportToMarkdown()" id="exportMd" title="Eksporter til Markdown">📄 Eksporter MD</button>
                    <button onclick="saveLayoutToLocal()" id="saveLayoutBtn" title="Gem layout permanent">💾 Gem layout</button>
                    <button onclick="resetLayout()" id="resetLayoutBtn" title="Nulstil layout">🔄 Reset layout</button>
                    <hr style="border-color:var(--border);margin:4px 0;">
                    <button onclick="window.open('/skillflow','_blank')" title="SkillFlow Analysis" style="background:var(--purple-accent);">🧬 SkillFlow</button>
                    <button onclick="window.open('/flow','_blank')" title="Flow Builder - Web Research">🔍 Flow Builder</button>
                    <button onclick="setGithubToken()" id="githubTokenBtn" title="Opsæt GitHub Token">🔑 GitHub Token</button>
                    <button onclick="showIssuesPanel()" id="issuesBtn" title="Vis alle issues">🐛 Issues</button>
                </div>
            </div>
        </div>
        <div id="folderStatus" style="font-size: 11px; margin-bottom: 5px;"></div>
        
        <div class="toolbar-row">
            <span class="toolbar-label" id="sessionsLabel">Sessions</span>
            <select id="sessionSelect" class="session-select">
                <option value="" id="selectSessionOpt">-- Vælg eller opret ny --</option>
            </select>
            <button onclick="refreshSessions()" id="refreshSess" title="Opdater">🔄</button>
            <button onclick="loadSelectedSession()" id="loadSess" title="Indlæs">📂 Indlæs</button>
            <button onclick="saveCurrentSession()" id="saveSess" title="Gem">💾 Gem</button>
            <button onclick="renameSession()" id="renameSess" title="Omdøb">✏️ Omdøb</button>
            <button onclick="createNewSession()" id="newSess" title="Ny session">➕ Ny</button>
        </div>
        
        <div class="toolbar-row">
            <span class="toolbar-label" id="templateLabel">Skabelon</span>
            <select id="templateSelect" class="toolbar-select">
                <option value="fri">🌳 Fri nedbrydning</option>
                <option value="resume">📄 Resumé</option>
                <option value="kodeanalyse">🔍 Kodeanalyse</option>
                <option value="diffanalyse">📊 Diff-analyse</option>
                <option value="agenten">🔀 PR Agenten</option>
                <option value="programmering">💻 Programmeringsopgave</option>
                <option value="python-arkitektur">🏗️ Python Arkitektur</option>
                <option value="billedanalyse">🖼️ Billedanalyse</option>
                <option value="bugfix">🐛 Bugfix (TDD)</option>
                <option value="refactor">🔧 Refaktorering</option>
            </select>
        </div>
        
        <div class="toolbar-row" id="issueRow" style="display:none;">
            <span class="toolbar-label" id="issuesLabel">🐛 Issues</span>
            <select id="issueSelect" class="toolbar-select" style="flex:1;" onchange="onIssueSelected(this.value)"></select>
            <button onclick="loadIssue()" id="loadIssueBtn" style="background:var(--btn-secondary);font-size:12px;padding:4px 8px;">📋 Indlæs</button>
            <button onclick="toggleIssueRow()" style="background:var(--danger);font-size:12px;padding:4px 8px;">✕</button>
        </div>
        <div class="toolbar-row">
            <span class="toolbar-label" id="llmLangLabel">🤖 LLM Sprog</span>
            <select id="llmLangSelect" class="toolbar-select" onchange="switchLLMLang(this.value)" style="min-width:80px;">
                <option value="da">🇩🇰 Dansk</option>
                <option value="en">🇬🇧 English</option>
                <option value="es">🇪🇸 Español</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <span class="toolbar-label" id="decomposeModelLabel">🌳 Decompose</span>
            <select id="decomposeModelSelect" class="toolbar-select" onchange="switchDecomposeModel(this.value)" style="flex:1;"></select>
            <span class="toolbar-label" id="executeModelLabel">⚡ Execute</span>
            <select id="modelSelect" class="toolbar-select" onchange="switchModel(this.value)" style="flex:1;"></select>
        </div>
        
        <div class="toolbar-row">
            <span class="toolbar-label" id="promptLabel">Prompt</span>

async function fetchModels() {
    try {
        const resp = await fetch('/api/models');
        const data = await resp.json();
        const populate = (selId, key) => {
            const sel = document.getElementById(selId);
            sel.innerHTML = '';
            for (const m of data.models) {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                sel.appendChild(opt);
            }
            if (key === 'execute' && currentModel) sel.value = currentModel;
            else if (key === 'decompose' && currentDecomposeModel) sel.value = currentDecomposeModel;
            else if (key === 'execute' && data.current) { sel.value = data.current; currentModel = data.current; }
            else if (key === 'decompose' && data.decompose_model) { sel.value = data.decompose_model; currentDecomposeModel = data.decompose_model; }
        };
        populate('modelSelect', 'execute');
        populate('decomposeModelSelect', 'decompose');
    } catch(e) { console.error('fetchModels', e); }
}

    currentModel = model;

function formatDate(iso) {
    if (!iso) return _('unknown');
    try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
}

function formatLogTime(ts) {
    const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
    if (isNaN(d.getTime())) return _('unknown');
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addLogEntry(level, message, detail) {
    const logBox = document.getElementById('logContent');
    if (!logBox) return;
    const now = new Date();
    const time = String(now.getDate()).padStart(2,'0') + '-' + 
                 String(now.getMonth()+1).padStart(2,'0') + '-' + 
                 now.getFullYear() + ' ' +
                 String(now.getHours()).padStart(2,'0') + ':' + 
                 String(now.getMinutes()).padStart(2,'0') + ':' + 
                 String(now.getSeconds()).padStart(2,'0');
    const logHtml = `<div class="log-entry log-${level}">
        <strong>[${time}] ${level}</strong>: ${escapeHtml(message)}<br>
        <span style="font-size: 10px; color: #64748b;">${escapeHtml(detail || '')}</span>
    </div>`;
    logBox.innerHTML += logHtml;
    logBox.scrollTop = logBox.scrollHeight;
}

function renderTree(node, path = []) {
    if (!node) return '';
    const statusClass = node.status === 'done' ? 'status-done' : (node.status === 'running' ? 'status-running' : 'status-pending');
    const statusText = node.status === 'done' ? '✓' : (node.status === 'running' ? '⏳' : '○');
    const pathStr = path.join('.');
    let html = `<div data-path="${pathStr}"><div class="tree-node-content">`;
    if (treeEditMode) {
        html += `<span style="margin-right:8px;"><button onclick="editTreeNode('${pathStr}')" title="${_('btn_edit')}" style="padding:2px 6px;font-size:10px;">✏️</button><button onclick="deleteTreeNode('${pathStr}')" title="${_('btn_delete')}" style="padding:2px 6px;font-size:10px;background:#ef4444;">🗑</button><button onclick="addTreeChild('${pathStr}')" title="${_('btn_add_child')}" style="padding:2px 6px;font-size:10px;background:#10b981;">➕</button></span>`;
    }
    html += `📌 ${escapeHtml(node.name)} <span class="task-status ${statusClass}">${statusText}</span></div>`;
    if (node.children && node.children.length > 0) { 
        html += `<div class="tree-children">`; 
        for (let i = 0; i < node.children.length; i++) { 
            html += renderTree(node.children[i], [...path, i]); 
        } 
        html += `</div>`; 
    }
    html += `</div>`; 
    return html;
}

        if (treeEditMode) html += ` <button onclick="addTreeChild('')" style="background:#3b82f6;border:none;padding:6px 12px;border-radius:6px;color:white;cursor:pointer;font-size:12px;">${_('new_root_task')}</button>`;
        html += `</div>`;
        html += renderTree(currentTree);
        treeContainer.innerHTML = html;
    }
}

function getNodeByPath(node, path) {
    if (!path) return node;
    const parts = path.split('.').filter(p => p !== '');
    for (const p of parts) {
        if (node.children && node.children[p]) {
            node = node.children[p];
        } else return null;
    }
    return node;
}

function editTreeNode(path) {
    const node = getNodeByPath(currentTree, path);
    if (!node) return;
    const newName = prompt(_('new_name_for'), node.name);
    if (newName && newName.trim()) {
        node.name = newName.trim().substring(0, 80);
        updateTreeDisplay();
        addLogEntry('INFO', _('task_renamed'), node.name);
    }
}

function deleteTreeNode(path) {
    if (!path) {
        alert(_('cant_delete_root'));
        return;
    }
    if (!confirm(_('confirm_delete_node'))) return;
    const parts = path.split('.').filter(p => p !== '');
    let parent = currentTree;
    for (let i = 0; i < parts.length - 1; i++) {
        parent = parent.children[parts[i]];
    }
    const idx = parseInt(parts[parts.length - 1]);
    const deleted = parent.children.splice(idx, 1)[0];
    updateTreeDisplay();
    addLogEntry('INFO', _('task_deleted'), deleted?.name || '');
}

function addTreeChild(path) {
    const parent = path ? getNodeByPath(currentTree, path) : currentTree;
    if (!parent) return;
    const name = prompt(_('new_task_name'), _('new_task'));
    if (name && name.trim()) {
        if (!parent.children) parent.children = [];
        parent.children.push({ name: name.trim().substring(0, 80), status: 'pending', children: [], result: null });
        updateTreeDisplay();
        addLogEntry('INFO', _('task_added'), name);
    }
}

async function updatePromptHistory(sessionId) {
    const historyContainer = document.getElementById('historyContent');
    if (!historyContainer) return;
    
    try {
        const response = await fetch(`/api/sessions/prompts/${sessionId}`);
        const data = await response.json();
        
        if (data.success && data.prompts && data.prompts.length > 0) {
            historyContainer.innerHTML = '';
            for (const item of data.prompts.slice().reverse()) {
                const time = formatLogTime(item.timestamp);
                const promptShort = item.prompt.length > 60 ? item.prompt.slice(0, 60) + '...' : item.prompt;
                const resultShort = item.result ? (item.result.length > 100 ? item.result.slice(0, 100) + '...' : item.result) : _('no_result_yet');
                
                historyContainer.innerHTML += `
                    <div class="history-item">
                        <div class="history-prompt">
                            📝 ${escapeHtml(promptShort)}
                            <span style="font-size: 10px; color: #64748b; float: right;">${time}</span>
                        </div>
                        <div class="history-result">
                            💡 ${_('result_label')} ${escapeHtml(resultShort)}
                        </div>
                        <button class="reuse-btn" onclick="reusePrompt('${escapeHtml(item.prompt).replace(/'/g, "\\'")}')">${_('reuse_prompt')}</button>
                    </div>
                `;
            }
        } else {
            historyContainer.innerHTML = `<div style="color: #64748b;">${_('no_prompts_yet')}</div>`;
        }
    } catch (e) {
        console.error(_('history_error'), e);
        historyContainer.innerHTML = `<div style="color: #ef4444;">${_('history_error')}</div>`;
    }
}

async function readFiles() {
    const preview = document.getElementById('fileContentPreview');
    const fileSection = document.getElementById('fileSection');
    const fileToggle = document.getElementById('fileSectionToggle');
    fileSection.style.display = 'block';
    fileToggle.textContent = _('hide_files');

    preview.innerHTML = '';
    
    if (loadedFilesContent.length > 0) {
        let filesDisplay = `<div style="color:#10b981; margin-bottom:8px;"><strong>${_('files_for_llm')}</strong><br>`;
        for (let i = 0; i < loadedFilesContent.length; i++) {
            const fc = loadedFilesContent[i];
            const ext = fc.filename.split('.').pop().toLowerCase();
            const langMap = { 'py': 'python', 'js': 'javascript', 'json': 'json', 'html': 'html', 'css': 'css', 'md': 'markdown' };
            const langClass = langMap[ext] || 'plaintext';
            const checked = fc.included ? 'checked' : '';
            preview.innerHTML += `<label style="display:flex; align-items:center; gap:8px; margin:8px 0;"><input type="checkbox" ${checked} onchange="toggleFileIncluded(${i}, this.checked)"> <strong>📄 ${fc.filename}</strong></label><pre class="language-${langClass}" style="max-height:150px;overflow-y:auto;margin:8px 0;${fc.included?'':'opacity:0.4'}"><code>${escapeHtml(fc.content.slice(0,3000))}${fc.content.length>3000?'...':''}</code></pre>`;
            try { Prism.highlightElement(preview.querySelectorAll('pre')[i].querySelector('code')); } catch(e) {}
            const status = fc.included ? '✓' : '✗';
            filesDisplay += `<label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" ${checked} onchange="toggleFileIncluded(${i}, this.checked)"> <span style="${fc.included?'color:var(--success)':'color:var(--danger)'}">${status}</span> ${fc.filename}</label>`;
            addLogEntry('INFO', _('file_shown'), fc.filename);
        }
        filesDisplay += '</div>';
        document.getElementById('selectedFilesDisplay').innerHTML = filesDisplay;
        const includedCount = loadedFilesContent.filter(f => f.included).length;
        const firstIncluded = loadedFilesContent.find(f => f.included);
        if (includedCount === 0) {
            document.getElementById('filePathInput').value = _('no_files');
        } else if (firstIncluded && firstIncluded.isImage) {
            document.getElementById('filePathInput').value = `🖼️ ${firstIncluded.filename}`;
        } else if (includedCount === 1) {
            document.getElementById('filePathInput').value = firstIncluded.filename;
        } else {
            document.getElementById('filePathInput').value = `${includedCount} ${_('files_selected')}`;
        }
        return;
    }
    
    if (selectedFiles.length === 0) {
        alert(_('select_files_first'));
        return;
    }
    
    loadedFilesContent = [];
    
    let filesDisplay = `<div style="color:var(--success); margin-bottom:8px;">📎 <strong>${_('files_included')}</strong><br>`;
    
    const IMG_EXT = {png:1,jpg:1,jpeg:1,gif:1,webp:1,bmp:1};
    
    for (const { name, file } of selectedFiles) {
        const ext = name.split('.').pop().toLowerCase();
        
        if (IMG_EXT[ext]) {
            addLogEntry('INFO', 'Billede uploades', name);
            const formData = new FormData();
            formData.append('image', file);
            try {
                const resp = await fetch('/api/image/upload', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.success) {
                    renderImagePreview();
                    loadedFilesContent.push({ filename: data.filename, filepath: data.filepath, content: '', included: true, isImage: true });
                    filesDisplay += `<label style="display:flex;align-items:center;gap:4px;"><span style="color:var(--success)">🖼️</span> ${data.filename} <span style="color:var(--text-muted);font-size:10px;font-family:monospace;">${data.filepath}</span></label>`;
                    addLogEntry('INFO', 'Billede tilføjet', `${data.filepath} (${data.size} bytes)`);
                    if (currentSessionId) saveCurrentSession();
                } else {
                    addLogEntry('ERROR', 'Billede fejlede', data.error);
                }
            } catch(e) {
                addLogEntry('ERROR', 'Upload fejl', e.message);
            }
            continue;
        }
        
        addLogEntry('INFO', _('reading_file_title'), name);
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const resp = await fetch('/api/file/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            
            if (data.success) {
                const readResp = await fetch('/api/file/read', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({filepath: data.filepath}) 
                });
                const readData = await readResp.json();
                
                if (readData.success) {
                    const ext = readData.filename.split('.').pop().toLowerCase();
                    const langMap = { 'py': 'python', 'js': 'javascript', 'json': 'json', 'html': 'html', 'css': 'css', 'md': 'markdown' };
                    const langClass = langMap[ext] || 'plaintext';
                    const idx = loadedFilesContent.length;
                    preview.innerHTML += `<label style="display:flex; align-items:center; gap:8px; margin:8px 0;"><input type="checkbox" checked onchange="toggleFileIncluded(${idx}, this.checked)"> <strong>📄 ${readData.filename}</strong> (${readData.lines} linjer)</label><pre class="language-${langClass}" style="max-height:300px;overflow-y:auto;margin:8px 0;"><code>${escapeHtml(readData.content)}</code></pre>`;
                    Prism.highlightElement(preview.lastElementChild.querySelector('code'));
                    
                    loadedFilesContent.push({ filename: readData.filename, filepath: readData.filepath, content: readData.content, included: true });
                    filesDisplay += `<label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" checked onchange="toggleFileIncluded(${loadedFilesContent.length-1}, this.checked)"> <span style="color:var(--success)">✓</span> ${readData.filename}</label>`;
                    
                    addLogEntry('INFO', _('file_read'), `${readData.filename} (${_('N_lines').replace('{n}', readData.lines)})`);
                } else {
                    preview.innerHTML += `<div style="color:var(--danger);">${_('could_not_read')} ${name}: ${readData.error}</div><br>`;
                }
            } else {
                preview.innerHTML += `<div style="color:#ef4444;">${_('could_not_upload')} ${name}: ${data.error}</div><br>`;
            }
        } catch(e) {
            preview.innerHTML += `<div style="color:#ef4444;">${_('error_prefix')} ${e.message}</div><br>`;
        }
    }
    
    selectedFiles = selectedFiles.filter(sf => !IMG_EXT[sf.name.split('.').pop().toLowerCase()]);
    
    filesDisplay += '</div>';
    document.getElementById('selectedFilesDisplay').innerHTML = filesDisplay;
    
    const imgCount = loadedFilesContent.filter(f => f.isImage).length;
    const textCount = loadedFilesContent.filter(f => !f.isImage).length;
    if (imgCount > 0 && textCount === 0) {
        const imgName = loadedFilesContent.find(f => f.isImage)?.filename || 'billedet';
        document.getElementById('promptInput').value = `Analyser billedet "${imgName}"`;
        document.getElementById('templateSelect').value = 'billedanalyse';
    } else if (selectedFiles.length === 1) {
        document.getElementById('promptInput').value = _('prompt_auto_analyze_singular');
    } else if (selectedFiles.length > 1) {
        document.getElementById('promptInput').value = _('prompt_auto_analyze_plural').replace('{n}', selectedFiles.length);
    } else if (imgCount > 0 && textCount > 0) {
        document.getElementById('promptInput').value = `Analyser ${textCount} fil(er) og ${imgCount} billede(r)`;
    }
}

function setupResize() {
    const handles = document.querySelectorAll('.resize-handle');
    
    handles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = handle.closest('.panel');
            if (!panel) return;
            
            panel.style.zIndex = '2';
            const startX = e.clientX;
            const startY = e.clientY;
            const startWidth = panel.offsetWidth;
            const startHeight = panel.offsetHeight;
            
            function onResize(e2) {
                panel.style.width = `${startWidth + e2.clientX - startX}px`;
                panel.style.height = `${startHeight + e2.clientY - startY}px`;
            }
            
            function stopResize() {
                panel.style.zIndex = '1';
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', stopResize);
                saveLayoutToSession();
            }
            
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        });
    });
}

function setupDragAndDrop() {
    const dragIcons = document.querySelectorAll('.drag-icon');
    
    dragIcons.forEach(icon => {
        icon.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = icon.closest('.panel');
            if (!panel) return;
            
            const panelId = panel.getAttribute('data-panel-id');
            bringToFront(panelId);
            
            const rect = panel.getBoundingClientRect();
            const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
            
            dragState = {
                active: true,
                panelId: panelId,
                startMouseX: e.clientX,
                startMouseY: e.clientY,
                startLeft: rect.left - containerRect.left,
                startTop: rect.top - containerRect.top,
                startWidth: rect.width,
                startHeight: rect.height
            };
            
            panel.classList.add('dragging');
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        });
    });
}

function onDrag(e) {
    if (!dragState.active) return;
    e.preventDefault();
    
    const deltaX = e.clientX - dragState.startMouseX;
    const deltaY = e.clientY - dragState.startMouseY;
    
    let newLeft = dragState.startLeft + deltaX;
    let newTop = dragState.startTop + deltaY;
    
    const container = document.getElementById('canvasContainer');
    const containerRect = container.getBoundingClientRect();
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    
    newLeft = Math.max(-dragState.startWidth + 50, Math.min(newLeft, containerRect.width - 50));
    newTop = Math.max(-dragState.startHeight + 50, Math.min(newTop, containerRect.height - 50));
    
    panel.style.left = `${newLeft}px`;
    panel.style.top = `${newTop}px`;
}

function stopDrag(e) {
    if (!dragState.active) return;
    
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    if (panel) {
        panel.classList.remove('dragging');
    }
    
    dragState.active = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    
    saveLayoutToSession();
}

function toggleMinimize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const content = panel.querySelector('.panel-content');
    const btn = panel.querySelector('.panel-controls button:first-child');
    
    if (content.style.display === 'none') {
        content.style.display = '';
        btn.textContent = '−';
        const savedHeight = panel.getAttribute('data-saved-height');
        if (savedHeight) {
            panel.style.height = savedHeight;
            panel.removeAttribute('data-saved-height');
        }
    } else {
        panel.setAttribute('data-saved-height', panel.style.height);
        content.style.display = 'none';
        btn.textContent = '+';
        panel.style.height = 'auto';
    }
    saveLayoutToSession();
}

function toggleMaximize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const btn = panel.querySelector('.panel-controls button:nth-child(2)');
    
    if (panel.getAttribute('data-maximized') === 'true') {
        const savedLeft = panel.getAttribute('data-saved-left');
        const savedTop = panel.getAttribute('data-saved-top');
        const savedWidth = panel.getAttribute('data-saved-width');
        const savedHeight = panel.getAttribute('data-saved-height');
        if (savedLeft) panel.style.left = savedLeft;
        if (savedTop) panel.style.top = savedTop;
        if (savedWidth) panel.style.width = savedWidth;
        if (savedHeight) panel.style.height = savedHeight;
        panel.removeAttribute('data-maximized');
        btn.textContent = '□';
    } else {
        panel.setAttribute('data-saved-left', panel.style.left);
        panel.setAttribute('data-saved-top', panel.style.top);
        panel.setAttribute('data-saved-width', panel.style.width);
        panel.setAttribute('data-saved-height', panel.style.height);
        panel.style.left = '20px';
        panel.style.top = '60px';
        panel.style.width = 'calc(100vw - 40px)';
        panel.style.height = 'calc(100vh - 140px)';
        panel.style.zIndex = '100';
        panel.setAttribute('data-maximized', 'true');
        btn.textContent = '❐';
    }
    saveLayoutToSession();
}

function applyLayout(layout) {
    if (!layout) return;
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel && layout[def.id]) {
            const l = layout[def.id];
            if (l.left) panel.style.left = l.left;
            if (l.top) panel.style.top = l.top;
            if (l.width) panel.style.width = l.width;
            if (l.height) panel.style.height = l.height;
            if (l.minimized) {
                const content = panel.querySelector('.panel-content');
                const btn = panel.querySelector('.panel-controls button:first-child');
                if (content) content.style.display = 'none';
                if (btn) btn.textContent = '+';
            }
        }
    }
}

async function saveLayoutToSession() {
    if (!currentSessionId) return;
    const layout = getCurrentLayout();
    await fetch('/api/sessions/save-layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, layout: layout })
    });
}

function resetLayout() {
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel) {
            panel.style.display = '';
            panel.style.left = `${def.defaultLeft}px`;
            panel.style.top = `${def.defaultTop}px`;
            panel.style.width = `${def.defaultWidth}px`;
            panel.style.height = `${def.defaultHeight}px`;
            const content = panel.querySelector('.panel-content');
            if (content) content.style.display = '';
            const btn = panel.querySelector('.panel-controls button:first-child');
            if (btn) btn.textContent = '−';
        }
    }
    saveLayoutToSession();
}

async function renameSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert(_('select_rename_session'));
        return;
    }
    const currentName = select.options[select.selectedIndex].text;
    const newName = prompt(_('new_name_prompt'), currentName);
    if (!newName || newName === currentName) return;
    
    const response = await fetch('/api/sessions/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, name: newName })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', _('session_renamed'), newName);
        refreshSessions();
    }
}

async function refreshSessions() {
    console.log('Refreshing sessions...');
    try {
        const response = await fetch('/api/sessions');
        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Sessions data:', data);
        if (data.success) {
            const select = document.getElementById('sessionSelect');
            select.innerHTML = '';
            const ph = document.createElement('option');
            ph.value = '';
            ph.textContent = _('select_session') || '-- Select or create new --';
            select.appendChild(ph);
            if (data.sessions && data.sessions.length > 0) {
                for (const session of data.sessions) {
                    const opt = document.createElement('option');
                    opt.value = session.id;
                    opt.textContent = `${escapeHtml(session.name)} (${session.prompt_count || 0})`;
                    select.appendChild(opt);
                }
            }
            if (currentSessionId) {
                select.value = currentSessionId;
            }
            console.log('Loaded', data.sessions.length, 'sessions');
        } else {
            console.log('Failed to load sessions:', data);
        }
    } catch(e) {
        console.error('Error loading sessions:', e);
    }
}

async function createNewSession() {
    const name = prompt(_('new_session_prompt'), `Session ${new Date().toLocaleTimeString()}`);
    if (name) {
        const response = await fetch('/api/sessions/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (data.success) {
            currentSessionId = data.session_id;
            currentTree = null;
            selectedFiles = [];
            loadedFilesContent = [];
            document.getElementById('promptInput').value = '';
            document.getElementById('filePathInput').value = '';
            document.getElementById('selectedFilesDisplay').innerHTML = '';
            const filePreview = document.getElementById('fileContentPreview');
            if (filePreview) { filePreview.innerHTML = ''; filePreview.style.display = 'none'; }
            const fileSection = document.getElementById('fileSection');
            if (fileSection) fileSection.style.display = 'none';
            const fileToggle = document.getElementById('fileSectionToggle');
            if (fileToggle) fileToggle.textContent = '▶ Vis filer';
            const treeContainer = document.getElementById('treeContainer');
            if (treeContainer) treeContainer.innerHTML = `<div style="color:#64748b;">${_('click_tree_hint')}</div>`;
            const llmContent = document.getElementById('llmContent');

async function loadSelectedSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert(_('select_session_to_load'));
        return;
    }
    if (currentSessionId && currentSessionId !== sessionId) {
        await saveCurrentSession();
    }
    const response = await fetch(`/api/sessions/load/${sessionId}`);
    const data = await response.json();
    if (data.success) {
        currentSessionId = sessionId;
        
        if (data.session.layout) {
            applyLayout(data.session.layout);
        } else {
            loadLayoutFromLocal();
        }
        
        if (data.session.tree) {
            currentTree = data.session.tree;
            updateTreeDisplay();
        }
        
        if (data.session.show_thinking !== undefined) {
            showThinking = data.session.show_thinking;
            const checkbox = document.getElementById('thinkingToggle');
            if (checkbox) {
                checkbox.checked = showThinking;
                const label = document.getElementById('thinkingLabel');
                if (label) {
                    label.textContent = showThinking ? 'Vis tænkning' : 'Skjul tænkning';
                }
            }
        }
        
        if (data.session.template) {
            document.getElementById('templateSelect').value = data.session.template;
            lastDecomposeTemplate = data.session.template;
        } else {
            document.getElementById('templateSelect').value = 'fri';
        }
        
        if (data.session.ui_lang) {
            currentLang = data.session.ui_lang;
            localStorage.setItem('agenten_lang', data.session.ui_lang);
            await loadLang(data.session.ui_lang);
        }
        
        if (data.session.lang) {
            currentLLMLang = data.session.lang;
            localStorage.setItem('agenten_llm_lang', data.session.lang);
            document.getElementById('llmLangSelect').value = data.session.lang;
        }
        
        if (data.session.agent_log) {
            const logBox = document.getElementById('logContent');
            if (logBox) {
                logBox.innerHTML = '';
                for (const log of data.session.agent_log) {
                    const time = formatLogTime(log.timestamp);
                    logBox.innerHTML += `<div class="log-entry log-${log.level}">
                        <strong>[${time}] ${log.level}</strong>: ${escapeHtml(log.message)}<br>
                        <span style="font-size: 10px;">${escapeHtml(log.detail || '')}</span>
                    </div>`;
                }
            }
        }
        
        await updatePromptHistory(sessionId);
        
        console.log('Session load - file_context:', data.session.file_context);
        
        selectedFiles = [];
        loadedFilesContent = [];
        document.getElementById('filePathInput').value = '';
        document.getElementById('selectedFilesDisplay').innerHTML = '';
        const filePreviewEl = document.getElementById('fileContentPreview');
        const fileSectionEl = document.getElementById('fileSection');
        const fileToggleEl = document.getElementById('fileSectionToggle');
        if (filePreviewEl) {
            filePreviewEl.innerHTML = '';
            filePreviewEl.style.display = 'none';
        }
        if (fileSectionEl) {
            fileSectionEl.style.display = 'none';
            if (fileToggleEl) fileToggleEl.textContent = '▶ Vis filer';
        }
        const promptInput = document.getElementById('promptInput');
        if (promptInput && data.session.original_prompt) {
            promptInput.value = data.session.original_prompt;
        } else if (promptInput && data.session.tree && data.session.tree.name) {
            promptInput.value = data.session.tree.name;
        }
        
        if (data.session.file_context && data.session.file_context.length > 0) {
            console.log('Loading files from session:', data.session.file_context);
            loadedFilesContent = [];
            let missingFiles = [];
            const IMG_EXT_2 = {png:1,jpg:1,jpeg:1,gif:1,webp:1,bmp:1};
            for (const fc of data.session.file_context) {
                const ext = (fc.filename || fc.filepath || '').split('.').pop().toLowerCase();
                if (IMG_EXT_2[ext]) continue; // images are loaded via agent.images, not /api/file/read
                console.log('Trying to load file:', fc.filepath);
                try {
                    const resp = await fetch('/api/file/read', { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({filepath: fc.filepath}) 
                    });
                    console.log('File read response:', resp.status);
                    const fileData = await resp.json();
                    console.log('File data:', fileData);
                    if (fileData.success) {
                        loadedFilesContent.push({ 
                            filename: fileData.filename, 
                            filepath: fileData.filepath, 
                            content: fileData.content,
                            included: true 
                        });
                        addLogEntry('INFO', _('files_reloaded'), fileData.filename);
                    } else {
                        missingFiles.push(fc.filename || fc.filepath);
                    }
                } catch(e) {
                    console.log('Error loading file:', e);
                    missingFiles.push(fc.filename || fc.filepath);
                }
            }
            if (missingFiles.length > 0) {
                alert('Følgende filer fra sessionen blev ikke fundet og skal vælges igen:\n\n' + missingFiles.join('\n'));
                loadedFilesContent = [];
                selectedFiles = [];
                document.getElementById('filePathInput').value = '';
                document.getElementById('selectedFilesDisplay').innerHTML = '<div style="color:#ef4444;">Filer mangler - vælg venligst igen</div>';
            } else {
                const fileNames = loadedFilesContent.map(f => f.filename).join(', ');
                document.getElementById('selectedFilesDisplay').innerHTML = `<div style="color:#10b981;">📎 ${loadedFilesContent.length} fil(er) genindlæst: ${fileNames}</div>`;
                const first = loadedFilesContent[0];
                if (first && first.isImage) {
                    document.getElementById('filePathInput').value = `🖼️ ${first.filename}`;
                } else {
                    document.getElementById('filePathInput').value = loadedFilesContent.length === 1 ? first.filename : `${loadedFilesContent.length} filer valgt`;
                }
                if (loadedFilesContent.length > 0 && filePreviewEl) {
                    document.getElementById('fileSection').style.display = 'block';
                    document.getElementById('fileSectionToggle').textContent = '▼ Skjul filer';
                    readFiles();
                }
            }
        }
        
        addLogEntry('INFO', _('session_loaded'), data.session.name);
        renderImagePreview();
    }
}

async function saveCurrentSession() {
    if (!currentSessionId) {
        await createNewSession();
    }
    const layout = getCurrentLayout();
    const currentPrompt = document.getElementById('promptInput').value;
    const fileContext = loadedFilesContent.map(f => ({ filename: f.filename, filepath: f.filepath, content: f.content || '' }));
    const response = await fetch('/api/sessions/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            session_id: currentSessionId,
            name: currentPrompt.slice(0, 30) || 'Session',
            tree: currentTree,
            layout: layout,
            prompt_history: [],
            file_context: fileContext,
            original_prompt: currentPrompt,
            show_thinking: showThinking,
            lang: currentLLMLang,
            ui_lang: currentLang,
            template: document.getElementById('templateSelect').value,
            decompose_model: currentDecomposeModel || undefined,
            execute_model: currentModel || undefined
        })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', _('session_saved'), currentSessionId);
        refreshSessions();
    }
}

async function decompose() {
    const prompt = document.getElementById('promptInput').value;
    if (!prompt) {
        alert(_('enter_task'));
        return;
    }
    
    const filesData = (loadedFilesContent || []).filter(f => f.included);
    console.log('Sending files to decompose:', filesData.length, filesData.map(f => f.filename));
    
    if (selectedFiles.length > 0 && loadedFilesContent.length === 0) {
        alert(_('files_not_read'));
        return;
    }
    
    addLogEntry('INFO', _('start_decompose'), prompt.slice(0, 50));
    if (filesData.length > 0) {
        addLogEntry('INFO', _('including_files'), `${filesData.length} fil(er)`);
    }
    
    const response = await fetch('/api/decompose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            prompt, 
            session_id: currentSessionId,
            show_thinking: showThinking,
            files: filesData,
            template: document.getElementById('templateSelect').value,
            lang: currentLLMLang,
            ui_lang: currentLang,
            decompose_model: currentDecomposeModel || undefined,
            execute_model: currentModel || undefined
        })
    });
    const data = await response.json();
    
    if (data.success) {
        currentTree = data.tree;
        currentSessionId = data.session_id;
        lastDecomposeTemplate = document.getElementById('templateSelect').value;
        updateTreeDisplay();
        await updatePromptHistory(currentSessionId);
        addLogEntry('INFO', _('decompose_done'), `${data.session_id}`);
        refreshSessions();
        await saveCurrentSession();

        // Show template warning if any
        const warnDiv = document.getElementById('templateWarning');
        let warnHtml = '';
        if (data.image_warning) {
            warnHtml += `<span class="template-warning-close" onclick="this.parentElement.style.display='none'">✕</span>`;
            warnHtml += `<span style="font-size:16px;">🖼️</span> ${data.image_warning}`;
        }
        if (data.template_warning) {
            if (warnHtml) warnHtml += '<br><br>';
            warnHtml += `<span class="template-warning-close" onclick="this.parentElement.style.display='none'">✕</span>`;
            warnHtml += data.template_warning.replace(/\n/g, '<br>');
            if (data.suggested_template) {
                warnHtml += `<br><br><button onclick="switchTemplate('${data.suggested_template}')" style="background:#10b981;border:none;padding:6px 14px;border-radius:6px;color:white;cursor:pointer;font-weight:bold;">Skift til '${data.suggested_template}'</button>`;
            }
        }
        if (warnHtml) {
            warnDiv.style.display = 'block';
            warnDiv.innerHTML = warnHtml;
        } else {
            warnDiv.style.display = 'none';
        }
    } else {
        addLogEntry('ERROR', 'Nedbrydning fejlede', data.error);
    }
}
