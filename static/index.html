async function resetExecution() {
    if (!currentTree) {
        alert(_('no_tree_to_reset'));
        return;
    }
    if (!confirm(_('confirm_reset'))) return;
    
    await fetch('/api/reset-execution', { method: 'POST' });
    
    function resetStatus(node) {
        node.status = 'pending';
        node.result = null;
        if (node.children) {
            node.children.forEach(child => resetStatus(child));
        }
    }
    resetStatus(currentTree);
    
    updateTreeDisplay();
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', _('tree_reset'), '');
    
    if (currentSessionId) saveCurrentSession();
}

async function deleteTree() {
    if (!currentTree) {
        alert(_('no_tree_to_delete'));
        return;
    }
    if (!confirm(_('confirm_delete_tree'))) {
        return;
    }
    currentTree = null;
    await fetch('/api/reset-execution', { method: 'POST' });
    const treeContainer = document.getElementById('treeContainer');
    if (treeContainer) treeContainer.innerHTML = `<div style="color:#64748b;">${_('click_tree_hint')}</div>`;
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', _('tree_deleted'), '');
    await saveCurrentSession();
}

let lastDecomposeTemplate = null;

async function executeWithStream() {
    const template = document.getElementById('templateSelect').value;
    if (!currentTree || (template !== 'fri' && template !== lastDecomposeTemplate)) {
        await decompose();
        if (!currentTree) return;
    }
    
    stopStream();
    
    document.getElementById('replyInput').style.display = 'inline-block';
    document.getElementById('replyBtn').style.display = 'inline-block';
    
    const llmBox = document.getElementById('llmContent');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    const progressContainer = document.getElementById('progressContainer');
    if (progressContainer) progressContainer.style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', _('context_received'), data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${_('N_tasks').replace('{n}', data.total_tasks)}</div>`;
                addLogEntry('INFO', _('streaming_started'), _('N_tasks').replace('{n}', data.total_tasks));
                break;
                
            case 'task_start':
                const currentTask = document.getElementById('currentTask');
                if (currentTask) currentTask.innerHTML = `📌 ${escapeHtml(data.task)} <span class="loading"></span>`;
                
                function markRunning(node) {
                    if (node.name === data.task) node.status = 'running';
                    if (node.children) node.children.forEach(markRunning);
                }
                if (currentTree) {
                    markRunning(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', _('task_started'), data.task);
                break;
                
            case 'progress_chunk':
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                let clean = currentOutputs[data.task];
                clean = clean.replace(/<think>[\s\S]*?<\/think>/g, '');
                clean = stripHarmony(clean);
                if (showThinking) {
                    const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                    const outputDiv = document.getElementById(outputId);
                    if (outputDiv) {
                        outputDiv.textContent = clean;
                    }
                }
                if (llmBox) llmBox.scrollTop = llmBox.scrollHeight;
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                const taskElem = document.getElementById('currentTask');
                if (taskElem) taskElem.innerHTML = `<span style="color:var(--success);">✓ ${escapeHtml(data.task)} færdig</span>`;
                
                if (!showThinking && llmBox) {
                    const output = stripHarmony(currentOutputs[data.task] || data.result || '');
                    const existing = llmBox.querySelector(`[data-task="${data.task}"]`);
                    if (existing) {
                        existing.innerHTML = `<strong style="color:var(--success);">✅ ${escapeHtml(data.task)}</strong><div style="white-space:pre-wrap;margin-top:5px;">${escapeHtml(output)}</div>`;
                    } else {
                        llmBox.innerHTML += `<div data-task="${data.task}" style="margin-bottom:15px;"><strong style="color:var(--success);">✅ ${escapeHtml(data.task)}</strong><div style="white-space:pre-wrap;margin-top:5px;">${escapeHtml(output)}</div></div>`;
                    }
                }
                
                function markDone(node) {
                    if (node.name === data.task) node.status = 'done';
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', _('task_done_label'), data.task);
                saveCurrentSession();
                break;
                
            case 'tool_call':
                addLogEntry('TOOL', `🔧 ${data.tool}`, JSON.stringify(data.args));
                break;
                
            case 'tool_result':
                const success = data.result?.success;
                const icon = success ? '✅' : '❌';
                const rtext = JSON.stringify(data.result, null, 2);
                addLogEntry(success ? 'TOOL' : 'ERROR', `${icon} ${data.tool}`, rtext.length > 500 ? rtext.slice(0, 500) + '…' : rtext);
                if (llmBox && success) {
                    llmBox.innerHTML += `<div style="color:var(--success); margin:5px 0; padding:5px; background:var(--panel-bg); border-left:3px solid var(--success); font-size:12px;">${icon} <strong>${escapeHtml(data.tool)}</strong>: ${escapeHtml(data.result.result?.url || data.result.result?.output || 'OK').slice(0, 150)}</div>`;
                    llmBox.scrollTop = llmBox.scrollHeight;
                }
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:var(--success); margin-top: 15px;">${_('all_done')}</div>`;
                if (progressContainer) progressContainer.style.display = 'none';
                addLogEntry('INFO', _('stream_done'), _('all_executed'));
                saveCurrentSession();
                updatePromptHistory(currentSessionId);
                eventSource.close();
                document.getElementById('replyInput').style.display = 'none';
                document.getElementById('replyBtn').style.display = 'none';
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:var(--danger);">❌ ${_('error_prefix')}${data.message}</div>`;
                addLogEntry('ERROR', _('stream_error'), data.message);
                eventSource.close();
                document.getElementById('replyInput').style.display = 'none';
                document.getElementById('replyBtn').style.display = 'none';
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Genopretter...');
    };
}

function stripHarmony(text) {
    if (!text) return text;
    // Remove entire analysis channel blocks (private reasoning)
    text = text.replace(/<\|channel\|>analysis<\|message\|>[\s\S]*?<\|end\|>/g, '');
    // Remove entire commentary channel blocks (internal tool chatter)
    text = text.replace(/<\|channel\|>commentary[^<]*<\|message\|>[\s\S]*?<\|end\|>/g, '');
    // Remove all remaining Harmony format tokens: <|channel|>, <|message|>, <|start|>, <|end|>, <|return|>, <|call|>, <|constrain|>, <|"|>
    text = text.replace(/<\|[^|]+\|>/g, '');
    // Clean up excessive whitespace
    text = text.replace(/\n{3,}/g, '\n\n').trim();
    return text;
}

function generateTreeMarkdown(node, level = 0) {
    if (!node) return '';
    
    const indent = '  '.repeat(level);
    const statusIcon = node.status === 'done' ? '✅' : (node.status === 'running' ? '🔄' : '⏳');
    let md = `${indent}- ${statusIcon} **${node.name}**\n`;
    
    if (node.children && node.children.length > 0) {
        for (const child of node.children) {
            md += generateTreeMarkdown(child, level + 1);
        }
    }
    
    return md;
}

async function exportToMarkdown() {
    if (!currentSessionId) {
        alert(_('no_active_session'));
        return;
    }
    
    const folderStatus = await fetch('/api/folder/status');
    const folderData = await folderStatus.json();
    const currentFolder = folderData.success ? folderData.folder : 'C:\\Dev\\Agenten\\exports';
    
    const chosenFolder = prompt(_('enter_export_path'), currentFolder);
    if (!chosenFolder) return;
    
    if (chosenFolder !== currentFolder) {
        await fetch('/api/folder/set', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({folder: chosenFolder}) });
        document.getElementById('folderStatus').innerHTML = `📁 Gemmer i: ${chosenFolder} <span class="folder-status">Aktiv</span>`;
    }
    
    addLogEntry('INFO', _('exporting'), currentSessionId);
    
    const response = await fetch(`/api/sessions/load/${currentSessionId}`);
    const data = await response.json();
    
    if (!data.success) {
        alert(_('cant_fetch_session'));
        return;
    }
    
    const session = data.session;
    const timestamp = new Date().toLocaleString();
    
let md = `${_('export_md_report_header')}\n\n`;
    md += `${_('export_md_name')} ${session.name}\n`;
    md += `${_('export_md_created')} ${formatDate(session.created)}\n`;
    md += `${_('export_md_exported')} ${timestamp}\n\n`;
    md += `---\n\n`;
    
    md += `${_('export_md_prompt')}\n\n`;
    md += `\`\`\`\n${session.original_prompt || _('export_md_no_prompt')}\n\`\`\`\n\n`;
    
    md += `${_('export_md_tree')}\n\n`;
    if (currentTree) {
        md += generateTreeMarkdown(currentTree);
    } else if (session.tree) {
        md += generateTreeMarkdown(session.tree);
    } else {
        md += `${_('export_md_no_tree')}\n\n`;
    }
    md += `\n`;
    
    md += `${_('export_md_llm')}\n\n`;
    const llmContent = document.getElementById('llmContent');
    if (llmContent && llmContent.innerText && llmContent.innerText !== 'Tryk "Udfør med streaming"' && llmContent.innerText !== _('click_stream_hint')) {
        md += `\`\`\`\n${stripHarmony(llmContent.innerText)}\n\`\`\`\n\n`;
    } else {
        md += `${_('export_md_no_llm')}\n\n`;
    }
    md += `\n`;
    
    md += `${_('export_md_log')}\n\n`;
    if (session.agent_log && session.agent_log.length > 0) {
        for (const log of session.agent_log) {
            const time = formatLogTime(log.timestamp);
            md += `- **[${time}] ${log.level}:** ${log.message}`;
            if (log.detail) md += ` - ${log.detail}`;
            md += `\n`;
        }
        md += `\n`;
    } else {
        md += `${_('export_md_no_log')}\n\n`;
    }
    
    md += `${_('export_md_history')}\n\n`;
    if (session.prompt_history && session.prompt_history.length > 0) {
        for (let i = 0; i < session.prompt_history.length; i++) {
            const item = session.prompt_history[i];
            const time = formatLogTime(item.timestamp);
            md += `### ${i + 1}. ${item.prompt}\n`;
            md += `- ${_('export_md_time')}${time}\n`;
            md += `- ${_('export_md_result')}\n`;
            md += `  \`\`\`\n  ${(item.result || _('export_md_no_result_yet')).slice(0, 500)}\n  \`\`\`\n`;
            if (item.tree) {
                md += `- ${_('export_md_treestructure')}\n`;
                md += `  \`\`\`\n  ${JSON.stringify(item.tree, null, 2).slice(0, 1000)}\n  \`\`\`\n`;
            }
            md += `\n`;
        }
    } else {
        md += `${_('export_md_no_prompts')}\n\n`;
    }
    
    md += `${_('export_md_knowledge')}\n\n`;
    if (session.learned_knowledge && session.learned_knowledge.length > 0) {
        for (const knowledge of session.learned_knowledge) {
            md += `- **[${knowledge.type}]** ${knowledge.content}\n`;
            md += `  - ${_('export_md_source')}${knowledge.source_prompt}\n`;
        }
        md += `\n`;
    } else {
        md += `${_('export_md_no_knowledge')}\n\n`;
    }
    
    md += `${_('export_md_layout')}\n\n`;
    if (session.layout) {
        md += `\`\`\`json\n${JSON.stringify(session.layout, null, 2)}\n\`\`\`\n\n`;
    }
    
    md += `${_('export_md_issues')}\n\n`;
    md += `${_('export_md_observations')}\n\n`;
    md += `- \n`;
    md += `- \n`;
    md += `- \n\n`;
    
    md += `---\n`;
    md += `${_('export_md_footer')}\n`;
    
    const filename = `agent_session_${currentSessionId}_${Date.now()}.md`;
    
    const saveResponse = await fetch('/api/folder/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filename, content: md, path: chosenFolder })
    });
    const saveData = await saveResponse.json();
    
    if (saveData.success) {
        addLogEntry('INFO', _('exported_to'), saveData.filepath);
        alert(`✅ Fil gemt i:\n${saveData.filepath}`);
    } else {
        addLogEntry('WARNING', 'Kunne ikke gemme til mappe', saveData.error);
        // Fallback til download
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addLogEntry('INFO', _('downloaded'), filename);
    }
}

async function previewMarkdown() {
    if (!currentSessionId && !currentTree) {
        alert(_('no_preview_data'));
        return;
    }
    
    addLogEntry('INFO', _('generating_preview'), '');
    
    const promptText = document.getElementById('promptInput')?.value || '';
    const treeContainer = document.getElementById('treeContainer')?.innerText || '';
    const llmContent = document.getElementById('llmContent')?.innerText || '';
    
    // Build Markdown
    let md = `# ${_('preview_title')}\n\n`;
    if (promptText) {
        md += `## ${_('prompt')}\n\n\`\`\`\n${promptText}\n\`\`\`\n\n`;
    }
    if (treeContainer && treeContainer !== _('click_tree_hint')) {
        md += `## ${_('tree_panel')}\n\n\`\`\`\n${treeContainer}\n\`\`\`\n\n`;
    }
    if (llmContent && llmContent !== _('click_stream_hint')) {
        const trimmed = llmContent.length > 8000 ? llmContent.slice(0, 8000) + '\n\n[... truncated ...]' : llmContent;
        md += `## ${_('llm_panel')}\n\n\`\`\`\n${trimmed}\n\`\`\`\n\n`;
    }
    if (loadedFilesContent.length > 0) {
        md += `## ${_('files_included')}\n\n`;
        for (const fc of loadedFilesContent.filter(f => f.included)) {
            md += `- **${fc.filename}**\n`;
        }
        md += '\n';
    }

    // Render Markdown to HTML
    const rendered = typeof marked !== 'undefined' ? marked.parse(md) : `<pre>${escapeHtml(md)}</pre>`;

    const html = `
    <div id="previewOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;justify-content:center;align-items:center;" onclick="if(event.target===this)closePreview()">
        <div style="background:var(--panel-bg);border-radius:16px;width:90%;max-width:1200px;height:90%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);">
            <div style="background:var(--panel-header);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:16px 16px 0 0;">
                <h2 style="margin:0;color:var(--text);">📊 ${_('preview_title')}</h2>
                <div style="display:flex;gap:10px;">
                    <button onclick="downloadFromPreview()" style="background:#10b981;border:none;padding:8px 16px;border-radius:8px;color:white;cursor:pointer;">💾 Download MD</button>
                    <button onclick="closePreview()" style="background:#ef4444;border:none;padding:8px 16px;border-radius:8px;color:white;cursor:pointer;">✕ Luk</button>
                </div>
            </div>
            <div id="previewContent" style="flex:1;overflow:auto;padding:20px 30px;color:var(--text);background:var(--bg);" class="rendered-markdown">
                ${rendered}
            </div>
        </div>
    </div>`;

    document.body.insertAdjacentHTML('beforeend', html);
    window._previewContent = md;
}

function closePreview() {
    const el = document.getElementById('previewOverlay');
    if (el) el.remove();
}

function downloadFromPreview() {
    const promptText = document.getElementById('promptInput')?.value || '';
    const treeContainer = document.getElementById('treeContainer')?.innerText || '';
    const llmContent = document.getElementById('llmContent')?.innerText || '';
    
    let md = `${_('preview_title')}\n\n`;
    if (promptText) md += `## ${_('export_md_prompt').replace('## ','')}\n\n${promptText}\n\n`;
    if (treeContainer && treeContainer !== _('click_tree_hint')) md += `${_('export_md_tree')}\n\n${treeContainer}\n\n`;
    if (llmContent && llmContent !== _('click_stream_hint')) md += `${_('export_md_llm')}\n\n${stripHarmony(llmContent)}\n\n`;
    
    if (loadedFilesContent.length > 0) {
        md += `${_('file_included_section')}\n\n`;
        for (const fc of loadedFilesContent.filter(f => f.included)) {
            md += `### ${fc.filename}\n\n${_('file_included_path')}: \`${fc.filepath}\`\n\n`;
        }
    }
    
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agenten_preview_${Date.now()}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    addLogEntry('INFO', _('preview_downloaded'), a.download);
}

function showIssuesPanel() {
    const modal = document.getElementById('issuesModal');
    const content = document.getElementById('issuesContent');
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Indlæser...</div>';
    modal.style.display = 'flex';
    fetch('/api/issues')
        .then(r => r.json())
        .then(data => {
            if (!data.issues || !data.issues.length) {
                content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Ingen issues fundet.</div>';
                return;
            }
            let html = `<table class="issues-table"><thead><tr>
                <th>ID</th><th>Titel</th><th>Type</th><th>Status</th><th>Prioritet</th><th></th>
            </tr></thead><tbody>`;
            for (const issue of data.issues) {
                const sevClass = `issue-severity-${issue.severity || 'low'}`;
                const statusClass = `issue-status-${issue.status || 'open'}`;
                const typeClass = `issue-type-${issue.type || 'bug'}`;
                const desc = (issue.description || '').substring(0, 120);
                const issueEnc = encodeURIComponent(JSON.stringify(issue));
                html += `<tr onclick="toggleIssueDetail(this)" style="cursor:pointer;">
                    <td><strong>${issue.id}</strong></td>
                    <td>${issue.title}
                        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${desc}...</div>
                        <div class="issue-detail" style="display:none;margin-top:6px;padding:8px;background:var(--input-bg);border-radius:6px;font-size:11px;line-height:1.5;">
                            <div><strong>Sted:</strong> ${issue.location || '—'}</div>
                            <div><strong>Impact:</strong> ${issue.impact || '—'}</div>
                            <div style="margin-top:4px;"><strong>Forslag:</strong> ${issue.proposed_fix || '—'}</div>
                            ${issue.resolution_note ? `<div style="margin-top:4px;color:var(--success);"><strong>Løsning:</strong> ${issue.resolution_note}</div>` : ''}
                            <button onclick="event.stopPropagation();useIssueAsTask('${issueEnc}')" style="margin-top:8px;background:var(--accent);color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;">
                                🚀 Brug som opgave
                            </button>
                        </div>
                    </td>
                    <td><span class="issue-type ${typeClass}">${issue.type}</span></td>
                    <td><span class="${statusClass}">${issue.status}</span></td>
                    <td><span class="${sevClass}">${issue.severity}</span></td>
                    <td><button onclick="event.stopPropagation();useIssueAsTask('${issueEnc}')" style="background:var(--accent);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap;">🚀 Kør</button></td>
                </tr>`;
            }
            html += '</tbody></table>';
            content.innerHTML = html;
        })
        .catch(e => {
            content.innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger);">Fejl: ${e.message}</div>`;
        });
}

function closeIssuesPanel() {
    document.getElementById('issuesModal').style.display = 'none';
}

function toggleIssueDetail(row) {
    const detail = row.querySelector('.issue-detail');
    if (detail) detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
}

function useIssueAsTask(encoded) {
    const issue = JSON.parse(decodeURIComponent(encoded));
    closeIssuesPanel();
    const prompt = document.getElementById('promptInput');
    const template = document.getElementById('templateSelect');
    const templateLabel = document.getElementById('templateLabel');
    const promptText = `${issue.id}: ${issue.title}\n\n${issue.description || ''}\n\nLocation: ${issue.location || '—'}\nImpact: ${issue.impact || '—'}\n\nForeslået fix: ${issue.proposed_fix || '—'}`;
    prompt.value = promptText;
    if (issue.type === 'bug' || issue.type === 'security') {
        template.value = 'bugfix';
    } else if (issue.type === 'architecture') {
        template.value = 'refactor';
    } else {
        template.value = 'fri';
    }
    addLogEntry('INFO', `${_('prompt_filled_from')} ${issue.id}`, issue.title);
}
