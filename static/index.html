<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Agenten</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0f172a;
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 15px;
        }
        
        .header {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            text-align: left;
            flex-shrink: 0;
        }
        
        h1 {
            margin: 0;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        
        .session-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .session-select {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            color: #e2e8f0;
            flex: 1;
        }
        
        .toolbar-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        
        .toolbar-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 70px;
            flex-shrink: 0;
        }
        
        .tools-toggle {
            background: #334155;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            position: relative;
        }
        
        .tools-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            z-index: 1000;
            min-width: 200px;
            flex-direction: column;
            gap: 4px;
        }
        
        .tools-dropdown.show {
            display: flex;
        }
        
        .tools-dropdown button {
            width: 100%;
            text-align: left;
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .tools-wrapper {
            position: relative;
            display: inline-block;
        }
        
        button {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover { background: #2563eb; }
        
        textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            background: #0f172a;
            border-radius: 16px;
            overflow: auto;
            min-height: 0;
        }
        
        .panel {
            position: absolute;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            min-width: 200px;
            min-height: 150px;
        }
        
        .panel.dragging {
            opacity: 0.8;
            cursor: grabbing;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .panel-header {
            background: #334155;
            padding: 10px 15px;
            cursor: grab;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .panel-header:active {
            cursor: grabbing;
        }
        
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: #e2e8f0;
        }
        
        .drag-icon {
            cursor: grab;
            margin-right: 8px;
            opacity: 0.6;
            font-size: 16px;
        }
        
        .drag-icon:active {
            cursor: grabbing;
        }
        
        .panel-controls {
            display: flex;
            gap: 8px;
        }
        
        .panel-controls button {
            background: #475569;
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        
        .panel-controls button:hover {
            background: #64748b;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, #60a5fa 50%);
            border-radius: 0 0 12px 0;
            z-index: 10;
        }
        
        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, #a78bfa 50%);
        }
        
        .tree-container, .llm-box, .log-box, .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .tree-node-content {
            padding: 4px 8px;
            margin: 2px 0;
            background: #1e293b;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }
        
        .tree-children {
            margin-left: 20px;
        }
        
        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .status-pending { background: #f59e0b; color: #0f172a; }
        .status-running { background: #3b82f6; }
        .status-done { background: #10b981; }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-bar {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 16px;
            transition: width 0.3s;
        }
        
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-left: 2px solid;
            font-size: 11px;
        }
        
        .log-INFO { border-left-color: #60a5fa; color: #93c5fd; }
        .log-DEBUG { border-left-color: #64748b; color: #94a3b8; }
        .log-ERROR { border-left-color: #ef4444; color: #fca5a5; }
        .log-LLM { border-left-color: #a78bfa; color: #c4b5fd; }
        
        .history-item {
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
            border-left: 3px solid #60a5fa;
        }
        
        .history-prompt {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 5px;
        }
        
        .history-result {
            font-size: 11px;
            color: #93c5fd;
            margin-top: 5px;
        }
        
        .reuse-btn {
            margin-top: 5px;
            font-size: 10px;
            padding: 2px 8px;
            background: #475569;
        }
        
        .folder-status {
            display: inline-block;
            background: #10b981;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 10px;
        }
        
        .file-preview {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
        }
        
        .file-preview pre {
            text-align: left;
            margin: 0;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <h1>🤖 Agenten</h1>
            <div class="tools-wrapper">
                <button class="tools-toggle" onclick="toggleTools()" title="Flere værktøjer">⚙️</button>
                <div class="tools-dropdown" id="toolsDropdown">
                    <button onclick="resetExecution()" title="Nulstil alle opgavers status">🔄 Nulstil træ</button>
                    <button onclick="deleteTree()" title="Slet hele opgavetræet">🗑 Slet træ</button>
                    <button onclick="previewMarkdown()" title="Forhåndsvis session">👁 Preview</button>
                    <button onclick="exportToMarkdown()" title="Eksporter til Markdown">📄 Eksporter MD</button>
                    <button onclick="saveLayoutToLocal()" title="Gem layout permanent">💾 Gem layout</button>
                    <button onclick="resetLayout()" title="Nulstil layout">🔄 Reset layout</button>
                    <hr style="border-color:#334155;margin:4px 0;">
                    <button onclick="setGithubToken()" title="Opsæt GitHub Token">🔑 GitHub Token</button>
                </div>
            </div>
        </div>
        <div id="folderStatus" style="font-size: 11px; margin-bottom: 5px;"></div>
        
        <div class="toolbar-row">
            <span class="toolbar-label">Sessions</span>
            <select id="sessionSelect" class="session-select">
                <option value="">-- Vælg eller opret ny --</option>
            </select>
            <button onclick="refreshSessions()" title="Opdater">🔄</button>
            <button onclick="loadSelectedSession()" title="Indlæs">📂 Indlæs</button>
            <button onclick="saveCurrentSession()" title="Gem">💾 Gem</button>
            <button onclick="renameSession()" title="Omdøb">✏️ Omdøb</button>
            <button onclick="createNewSession()" title="Ny session">➕ Ny</button>
        </div>
        
        <div class="toolbar-row">
            <span class="toolbar-label">Skabelon</span>
            <select id="templateSelect" style="background:#1e293b;border:1px solid #334155;padding:8px;border-radius:8px;color:#e2e8f0;">
                <option value="fri">🌳 Fri nedbrydning</option>
                <option value="resume">📄 Resumé</option>
                <option value="kodeanalyse">🔍 Kodeanalyse</option>
                <option value="diffanalyse">📊 Diff-analyse</option>
            </select>
            <label style="display:inline-flex;align-items:center;gap:8px;background:#8b5cf6;padding:8px 12px;border-radius:6px;cursor:pointer;">
                <input type="checkbox" id="thinkingToggle" onchange="toggleThinkingMode()" checked>
                <span id="thinkingLabel" style="color:white;font-size:14px;">Vis tænkning</span>
            </label>
            <select id="langSelect" onchange="switchLang(this.value)" style="background:#1e293b;border:1px solid #334155;padding:8px;border-radius:8px;color:#e2e8f0;min-width:80px;">
                <option value="da">🇩🇰</option>
                <option value="en">🇬🇧</option>
                <option value="es">🇪🇸</option>
                <option value="zh">🇨🇳</option>
            </select>
        </div>
        
        <div class="toolbar-row">
            <span class="toolbar-label">Filer</span>
            <input type="text" id="filePathInput" placeholder="Vælg fil(er) med Gennemse, derefter Læs fil" style="flex:1;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;color:#e2e8f0;" readonly>
            <input type="file" id="filePicker" style="display:none" multiple onchange="onFilePicked(event)">
            <button onclick="document.getElementById('filePicker').click()" style="background:#475569;">📂 Gennemse</button>
            <button onclick="readFiles()" style="background:#8b5cf6;">📖 Læs fil</button>
        </div>
        <div id="fileSectionToggle" style="margin: 2px 0; cursor: pointer; color:#60a5fa; font-size:12px;" onclick="toggleFileSection()">▶ Vis filer</div>
        <div id="fileSection" style="display:none;">
            <div id="selectedFilesDisplay" style="font-size:11px; color:#64748b; margin: 5px 0;"></div>
            <div id="fileContentPreview" class="file-preview"></div>
        </div>
        
        <div class="toolbar-row">
            <span class="toolbar-label">Prompt</span>
            <textarea id="promptInput" rows="2" placeholder="Indtast en opgave f.eks.:&#10;Hvordan ved jeg at 2 + 2 er 4?" style="flex:1;"></textarea>
            <button onclick="decompose()">🌳 Nedbryd</button>
            <button onclick="executeWithStream()" style="background:#10b981;">⚡ Udfør</button>
            <button onclick="stopStream()" style="background:#ef4444;">⏹ Stop</button>
        </div>
    </div>
    
    <div class="canvas-container" id="canvasContainer"></div>
</div>

<script>
// === Multi-language translation system (DRY) ===
window.AGENTEN_LANG = {};
let currentLang = localStorage.getItem('agenten_lang') || 'da';

async function loadLang(lang) {
    const resp = await fetch(`/api/lang/${lang}`);
    window.AGENTEN_LANG = await resp.json();
    document.getElementById('langSelect').value = lang;
    currentLang = lang;
    localStorage.setItem('agenten_lang', lang);
    updateAllUIText();
}

function _(key) {
    return window.AGENTEN_LANG[key] || `?${key}`;
}

function switchLang(lang) {
    loadLang(lang);
}

function updateAllUIText() {
    updatePanelTitles();
}

function updatePanelTitles() {
    const titles = {
        'tree': _('tree_panel') || '📁 Opgavetræ',
        'llm': _('llm_panel') || '📡 LLM Output',
        'log': _('log_panel') || '📋 Agent Log',
        'history': _('history_panel') || '📜 Prompt Historik',
    };
    for (const def of panelDefinitions) {
        if (titles[def.id]) def.title = titles[def.id];
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel) {
            const h3 = panel.querySelector('h3');
            if (h3) h3.textContent = titles[def.id];
        }
    }
}

loadLang(currentLang);
// === End translation system ===

// Panel definitioner med alle 4 paneler
const panelDefinitions = [
    { id: 'tree', title: '📁 Opgavetræ', defaultLeft: 20, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'llm', title: '📡 LLM Output', defaultLeft: 440, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'log', title: '📋 Agent Log', defaultLeft: 860, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'history', title: '📜 Prompt Historik', defaultLeft: 20, defaultTop: 340, defaultWidth: 1240, defaultHeight: 200 }
];

function getCurrentLayout() {
    const layout = {};
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel) {
            layout[def.id] = {
                left: panel.style.left,
                top: panel.style.top,
                width: panel.style.width,
                height: panel.style.height,
                minimized: panel.querySelector('.panel-content')?.style.display === 'none'
            };
        }
    }
    return layout;
}

function saveLayoutToLocal() {
    const layout = getCurrentLayout();
    localStorage.setItem('agenten_layout', JSON.stringify(layout));
    addLogEntry('INFO', 'Layout gemt permanent', 'Gemmer i browser');
}

function loadLayoutFromLocal() {
    const saved = localStorage.getItem('agenten_layout');
    if (saved) {
        try {
            const layout = JSON.parse(saved);
            applyLayout(layout);
            addLogEntry('INFO', 'Layout genoprettet', 'Fra tidligere session');
        } catch(e) { console.log('Kunne ikke genoprette layout:', e); }
    }
}

setTimeout(loadLayoutFromLocal, 500);

let currentSessionId = null;
let currentTree = null;
let eventSource = null;
let panels = {};
let showThinking = true;
let treeEditMode = false;

// Drag state
let dragState = {
    active: false,
    panelId: null,
    startMouseX: 0,
    startMouseY: 0,
    startLeft: 0,
    startTop: 0
};

// Resize state
let resizeState = {
    active: false,
    panelId: null,
    startMouseX: 0,
    startMouseY: 0,
    startWidth: 0,
    startHeight: 0
};

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addLogEntry(level, message, detail) {
    const logBox = document.getElementById('logContent');
    if (!logBox) return;
    const now = new Date();
    const time = String(now.getDate()).padStart(2,'0') + '-' + 
                 String(now.getMonth()+1).padStart(2,'0') + '-' + 
                 now.getFullYear() + ' ' +
                 String(now.getHours()).padStart(2,'0') + ':' + 
                 String(now.getMinutes()).padStart(2,'0') + ':' + 
                 String(now.getSeconds()).padStart(2,'0');
    const logHtml = `<div class="log-entry log-${level}">
        <strong>[${time}] ${level}</strong>: ${escapeHtml(message)}<br>
        <span style="font-size: 10px; color: #64748b;">${escapeHtml(detail || '')}</span>
    </div>`;
    logBox.innerHTML += logHtml;
    logBox.scrollTop = logBox.scrollHeight;
}

function renderTree(node, path = []) {
    if (!node) return '';
    const statusClass = node.status === 'done' ? 'status-done' : (node.status === 'running' ? 'status-running' : 'status-pending');
    const statusText = node.status === 'done' ? '✓' : (node.status === 'running' ? '⏳' : '○');
    const pathStr = path.join('.');
    let html = `<div data-path="${pathStr}"><div class="tree-node-content">`;
    if (treeEditMode) {
        html += `<span style="margin-right:8px;"><button onclick="editTreeNode('${pathStr}')" title="Rediger" style="padding:2px 6px;font-size:10px;">✏️</button><button onclick="deleteTreeNode('${pathStr}')" title="Slet" style="padding:2px 6px;font-size:10px;background:#ef4444;">🗑</button><button onclick="addTreeChild('${pathStr}')" title="Tilføj underopgave" style="padding:2px 6px;font-size:10px;background:#10b981;">➕</button></span>`;
    }
    html += `📌 ${escapeHtml(node.name)} <span class="task-status ${statusClass}">${statusText}</span></div>`;
    if (node.children && node.children.length > 0) { 
        html += `<div class="tree-children">`; 
        for (let i = 0; i < node.children.length; i++) { 
            html += renderTree(node.children[i], [...path, i]); 
        } 
        html += `</div>`; 
    }
    html += `</div>`; 
    return html;
}

function updateTreeDisplay() {
    const treeContainer = document.getElementById('treeContent');
    if (treeContainer && currentTree) {
        let html = `<div style="margin-bottom:10px;">`;
        html += `<button onclick="toggleTreeEditMode()" style="background:${treeEditMode?'#10b981':'#475569'};border:none;padding:6px 12px;border-radius:6px;color:white;cursor:pointer;font-size:12px;">${treeEditMode?'✅ Gem ændringer':'✏️ Rediger træ'}</button>`;
        if (treeEditMode) html += ` <button onclick="addTreeChild('')" style="background:#3b82f6;border:none;padding:6px 12px;border-radius:6px;color:white;cursor:pointer;font-size:12px;">➕ Ny hovedopgave</button>`;
        html += `</div>`;
        html += renderTree(currentTree);
        treeContainer.innerHTML = html;
    }
}

function toggleTreeEditMode() {
    treeEditMode = !treeEditMode;
    updateTreeDisplay();
}

function getNodeByPath(node, path) {
    if (!path) return node;
    const parts = path.split('.').filter(p => p !== '');
    for (const p of parts) {
        if (node.children && node.children[p]) {
            node = node.children[p];
        } else return null;
    }
    return node;
}

function editTreeNode(path) {
    const node = getNodeByPath(currentTree, path);
    if (!node) return;
    const newName = prompt('Ny navn for opgaven:', node.name);
    if (newName && newName.trim()) {
        node.name = newName.trim().substring(0, 80);
        updateTreeDisplay();
        addLogEntry('INFO', 'Opgave omdøbt', node.name);
    }
}

function deleteTreeNode(path) {
    if (!path) {
        alert('Kan ikke slette hovedroden - brug "Slet træ" i stedet');
        return;
    }
    if (!confirm('Slet denne opgave og alle underopgaver?')) return;
    const parts = path.split('.').filter(p => p !== '');
    let parent = currentTree;
    for (let i = 0; i < parts.length - 1; i++) {
        parent = parent.children[parts[i]];
    }
    const idx = parseInt(parts[parts.length - 1]);
    const deleted = parent.children.splice(idx, 1)[0];
    updateTreeDisplay();
    addLogEntry('INFO', 'Opgave slettet', deleted?.name || '');
}

function addTreeChild(path) {
    const parent = path ? getNodeByPath(currentTree, path) : currentTree;
    if (!parent) return;
    const name = prompt('Navn på ny opgave:', 'Ny opgave');
    if (name && name.trim()) {
        if (!parent.children) parent.children = [];
        parent.children.push({ name: name.trim().substring(0, 80), status: 'pending', children: [], result: null });
        updateTreeDisplay();
        addLogEntry('INFO', 'Opgave tilføjet', name);
    }
}

async function updatePromptHistory(sessionId) {
    const historyContainer = document.getElementById('historyContent');
    if (!historyContainer) return;
    
    try {
        const response = await fetch(`/api/sessions/prompts/${sessionId}`);
        const data = await response.json();
        
        if (data.success && data.prompts && data.prompts.length > 0) {
            historyContainer.innerHTML = '';
            for (const item of data.prompts.slice().reverse()) {
                const time = new Date(item.timestamp).toLocaleTimeString();
                const promptShort = item.prompt.length > 60 ? item.prompt.slice(0, 60) + '...' : item.prompt;
                const resultShort = item.result ? (item.result.length > 100 ? item.result.slice(0, 100) + '...' : item.result) : 'Ingen resultat endnu';
                
                historyContainer.innerHTML += `
                    <div class="history-item">
                        <div class="history-prompt">
                            📝 ${escapeHtml(promptShort)}
                            <span style="font-size: 10px; color: #64748b; float: right;">${time}</span>
                        </div>
                        <div class="history-result">
                            💡 Resultat: ${escapeHtml(resultShort)}
                        </div>
                        <button class="reuse-btn" onclick="reusePrompt('${escapeHtml(item.prompt).replace(/'/g, "\\'")}')">🔄 Genbrug denne prompt</button>
                    </div>
                `;
            }
        } else {
            historyContainer.innerHTML = `<div style="color: #64748b;">${_('no_prompts_yet')}</div>`;
        }
    } catch (e) {
        console.error('Failed to load history:', e);

async function readFiles() {
    const preview = document.getElementById('fileContentPreview');
    const fileSection = document.getElementById('fileSection');
    const fileToggle = document.getElementById('fileSectionToggle');
    fileSection.style.display = 'block';
    fileToggle.textContent = '▼ Skjul filer';
    preview.style.display = 'block';
    preview.innerHTML = '';
    
    if (loadedFilesContent.length > 0) {
        let filesDisplay = '<div style="color:#10b981; margin-bottom:8px;"><strong>📎 Filvalg for LLM kontekst:</strong><br>';
        for (let i = 0; i < loadedFilesContent.length; i++) {
            const fc = loadedFilesContent[i];
            const ext = fc.filename.split('.').pop().toLowerCase();
            const langMap = { 'py': 'python', 'js': 'javascript', 'json': 'json', 'html': 'html', 'css': 'css', 'md': 'markdown' };
            const langClass = langMap[ext] || 'plaintext';
            const checked = fc.included ? 'checked' : '';
            preview.innerHTML += `<label style="display:flex; align-items:center; gap:8px; margin:8px 0;"><input type="checkbox" ${checked} onchange="toggleFileIncluded(${i}, this.checked)"> <strong>📄 ${fc.filename}</strong></label><pre class="language-${langClass}" style="max-height:150px;overflow-y:auto;margin:8px 0;${fc.included?'':'opacity:0.4'}"><code>${escapeHtml(fc.content.slice(0,3000))}${fc.content.length>3000?'...':''}</code></pre>`;
            try { Prism.highlightElement(preview.querySelectorAll('pre')[i].querySelector('code')); } catch(e) {}
            const status = fc.included ? '✓' : '✗';
            filesDisplay += `<label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" ${checked} onchange="toggleFileIncluded(${i}, this.checked)"> <span style="${fc.included?'color:#10b981':'color:#ef4444'}">${status}</span> ${fc.filename}</label>`;
            addLogEntry('INFO', 'Fil vist', fc.filename);
        }
        filesDisplay += '</div>';
        document.getElementById('selectedFilesDisplay').innerHTML = filesDisplay;
        const includedCount = loadedFilesContent.filter(f => f.included).length;
        document.getElementById('filePathInput').value = includedCount === 0 ? 'Ingen filer valgt' : (includedCount === 1 ? loadedFilesContent.find(f => f.included).filename : `${includedCount} filer valgt`);
        return;
    }
    
    if (selectedFiles.length === 0) {
        alert('Vælg først fil(er) med Gennemse');
        return;
    }
    
    loadedFilesContent = [];
    
    let filesDisplay = '<div style="color:#10b981; margin-bottom:8px;">📎 <strong>Filer inkluderet i LLM kontekst:</strong><br>';
    
    for (const { name, file } of selectedFiles) {
        addLogEntry('INFO', 'Læser fil', name);
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const resp = await fetch('/api/file/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            
            if (data.success) {
                const readResp = await fetch('/api/file/read', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({filepath: data.filepath}) 
                });
                const readData = await readResp.json();
                
                if (readData.success) {
                    const ext = readData.filename.split('.').pop().toLowerCase();
                    const langMap = { 'py': 'python', 'js': 'javascript', 'json': 'json', 'html': 'html', 'css': 'css', 'md': 'markdown' };
                    const langClass = langMap[ext] || 'plaintext';
                    const idx = loadedFilesContent.length;
                    preview.innerHTML += `<label style="display:flex; align-items:center; gap:8px; margin:8px 0;"><input type="checkbox" checked onchange="toggleFileIncluded(${idx}, this.checked)"> <strong>📄 ${readData.filename}</strong> (${readData.lines} linjer)</label><pre class="language-${langClass}" style="max-height:300px;overflow-y:auto;margin:8px 0;"><code>${escapeHtml(readData.content)}</code></pre>`;
                    Prism.highlightElement(preview.lastElementChild.querySelector('code'));
                    
                    loadedFilesContent.push({ filename: readData.filename, filepath: readData.filepath, content: readData.content, included: true });
                    filesDisplay += `<label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" checked onchange="toggleFileIncluded(${loadedFilesContent.length-1}, this.checked)"> <span style="color:#10b981">✓</span> ${readData.filename}</label>`;
                    
                    addLogEntry('INFO', 'Fil indlæst', `${readData.filename} (${readData.lines} linjer)`);
                } else {
                    preview.innerHTML += `<div style="color:#ef4444;">Fejl ved læsning af ${name}: ${readData.error}</div><br>`;
                }
            } else {
                preview.innerHTML += `<div style="color:#ef4444;">Fejl ved upload af ${name}: ${data.error}</div><br>`;
            }
        } catch(e) {
            preview.innerHTML += `<div style="color:#ef4444;">Fejl: ${e.message}</div><br>`;
        }
    }
    
    filesDisplay += '</div>';
    document.getElementById('selectedFilesDisplay').innerHTML = filesDisplay;
    
    if (selectedFiles.length === 1) {
        document.getElementById('promptInput').value = `Analyser ${selectedFiles[0].name} grundigt. Giv en struktureret analyse af koden.`;
    } else {
        document.getElementById('promptInput').value = `Analyser ${selectedFiles.length} filer grundigt. Giv en struktureret analyse af koden og sammenlign dem.`;
    }
}

function bringToFront(panelId) {

        if (z > maxZ) maxZ = z;
    });
    const panel = document.getElementById(`panel-${panelId}`);
    if (panel) {
        panel.style.zIndex = maxZ + 1;
    }
}

function setupResize() {
    const handles = document.querySelectorAll('.resize-handle');
    
    handles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = handle.closest('.panel');
            if (!panel) return;
            
            panel.style.zIndex = '2';
            const startX = e.clientX;
            const startY = e.clientY;
            const startWidth = panel.offsetWidth;
            const startHeight = panel.offsetHeight;
            
            function onResize(e2) {
                panel.style.width = `${startWidth + e2.clientX - startX}px`;
                panel.style.height = `${startHeight + e2.clientY - startY}px`;
            }
            
            function stopResize() {
                panel.style.zIndex = '1';
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', stopResize);
                saveLayoutToSession();
            }
            
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        });
    });
}

function setupDragAndDrop() {
    const dragIcons = document.querySelectorAll('.drag-icon');
    
    dragIcons.forEach(icon => {
        icon.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = icon.closest('.panel');
            if (!panel) return;
            
            const panelId = panel.getAttribute('data-panel-id');
            bringToFront(panelId);
            
            const rect = panel.getBoundingClientRect();
            const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
            
            dragState = {
                active: true,
                panelId: panelId,
                startMouseX: e.clientX,
                startMouseY: e.clientY,
                startLeft: rect.left - containerRect.left,
                startTop: rect.top - containerRect.top,
                startWidth: rect.width,
                startHeight: rect.height
            };
            
            panel.classList.add('dragging');
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        });
    });
}

function onDrag(e) {
    if (!dragState.active) return;
    e.preventDefault();
    
    const deltaX = e.clientX - dragState.startMouseX;
    const deltaY = e.clientY - dragState.startMouseY;
    
    let newLeft = dragState.startLeft + deltaX;
    let newTop = dragState.startTop + deltaY;
    
    const container = document.getElementById('canvasContainer');
    const containerRect = container.getBoundingClientRect();
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    
    newLeft = Math.max(-dragState.startWidth + 50, Math.min(newLeft, containerRect.width - 50));
    newTop = Math.max(-dragState.startHeight + 50, Math.min(newTop, containerRect.height - 50));
    
    panel.style.left = `${newLeft}px`;
    panel.style.top = `${newTop}px`;
}

function stopDrag(e) {
    if (!dragState.active) return;
    
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    if (panel) {
        panel.classList.remove('dragging');
    }
    
    dragState.active = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    
    saveLayoutToSession();
}

function toggleMinimize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const content = panel.querySelector('.panel-content');
    const btn = panel.querySelector('.panel-controls button:first-child');
    
    if (content.style.display === 'none') {
        content.style.display = '';
        btn.textContent = '−';
        const savedHeight = panel.getAttribute('data-saved-height');
        if (savedHeight) {
            panel.style.height = savedHeight;
            panel.removeAttribute('data-saved-height');
        }
    } else {
        panel.setAttribute('data-saved-height', panel.style.height);
        content.style.display = 'none';
        btn.textContent = '+';
        panel.style.height = 'auto';
    }
    saveLayoutToSession();
}

function toggleMaximize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const btn = panel.querySelector('.panel-controls button:nth-child(2)');
    
    if (panel.getAttribute('data-maximized') === 'true') {
        const savedLeft = panel.getAttribute('data-saved-left');
        const savedTop = panel.getAttribute('data-saved-top');
        const savedWidth = panel.getAttribute('data-saved-width');
        const savedHeight = panel.getAttribute('data-saved-height');
        if (savedLeft) panel.style.left = savedLeft;
        if (savedTop) panel.style.top = savedTop;
        if (savedWidth) panel.style.width = savedWidth;
        if (savedHeight) panel.style.height = savedHeight;
        panel.removeAttribute('data-maximized');
        btn.textContent = '□';
    } else {
        panel.setAttribute('data-saved-left', panel.style.left);
        panel.setAttribute('data-saved-top', panel.style.top);
        panel.setAttribute('data-saved-width', panel.style.width);
        panel.setAttribute('data-saved-height', panel.style.height);
        panel.style.left = '20px';
        panel.style.top = '60px';
        panel.style.width = 'calc(100vw - 40px)';
        panel.style.height = 'calc(100vh - 140px)';
        panel.style.zIndex = '100';
        panel.setAttribute('data-maximized', 'true');
        btn.textContent = '❐';
    }
    saveLayoutToSession();
}

function applyLayout(layout) {
    if (!layout) return;
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel && layout[def.id]) {
            const l = layout[def.id];
            if (l.left) panel.style.left = l.left;
            if (l.top) panel.style.top = l.top;
            if (l.width) panel.style.width = l.width;
            if (l.height) panel.style.height = l.height;
            if (l.minimized) {
                const content = panel.querySelector('.panel-content');
                const btn = panel.querySelector('.panel-controls button:first-child');
                if (content) content.style.display = 'none';
                if (btn) btn.textContent = '+';
            }
        }
    }
}

async function loadSelectedSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert('Vælg en session');
        return;
    }
    const response = await fetch(`/api/sessions/load/${sessionId}`);
    const data = await response.json();
    if (data.success) {
        currentSessionId = sessionId;
        
        if (data.session.layout) {
            applyLayout(data.session.layout);
        } else {
            loadLayoutFromLocal();
        }
        
        if (data.session.tree) {
            currentTree = data.session.tree;
            updateTreeDisplay();
        }
        
        if (data.session.show_thinking !== undefined) {
            showThinking = data.session.show_thinking;
            const checkbox = document.getElementById('thinkingToggle');
            if (checkbox) {
                checkbox.checked = showThinking;
                const label = document.getElementById('thinkingLabel');
                if (label) {
                    label.textContent = showThinking ? 'Vis tænkning' : 'Skjul tænkning';
                }
            }
        }
        
        if (data.session.template) {
            document.getElementById('templateSelect').value = data.session.template;
            lastDecomposeTemplate = data.session.template;
        } else {
            document.getElementById('templateSelect').value = 'fri';
        }
        
        if (data.session.agent_log) {
            const logBox = document.getElementById('logContent');
            if (logBox) {
                logBox.innerHTML = '';
                for (const log of data.session.agent_log) {
                    const time = new Date(log.timestamp * 1000).toLocaleTimeString();
                    logBox.innerHTML += `<div class="log-entry log-${log.level}">
                        <strong>[${time}] ${log.level}</strong>: ${escapeHtml(log.message)}<br>
                        <span style="font-size: 10px;">${escapeHtml(log.detail || '')}</span>
                    </div>`;
                }
            }
        }
        
        await updatePromptHistory(sessionId);
        
        console.log('Session load - file_context:', data.session.file_context);
        
        selectedFiles = [];
        loadedFilesContent = [];
        document.getElementById('filePathInput').value = '';
        document.getElementById('selectedFilesDisplay').innerHTML = '';
        const filePreviewEl = document.getElementById('fileContentPreview');
        const fileSectionEl = document.getElementById('fileSection');
        const fileToggleEl = document.getElementById('fileSectionToggle');
        if (filePreviewEl) {
            filePreviewEl.innerHTML = '';
            filePreviewEl.style.display = 'none';
        }
        if (fileSectionEl) {
            fileSectionEl.style.display = 'none';
            if (fileToggleEl) fileToggleEl.textContent = '▶ Vis filer';
        }
        const promptInput = document.getElementById('promptInput');
        if (promptInput && data.session.original_prompt) {
            promptInput.value = data.session.original_prompt;
        } else if (promptInput && data.session.tree && data.session.tree.name) {
            promptInput.value = data.session.tree.name;
        }
        
        if (data.session.file_context && data.session.file_context.length > 0) {
            console.log('Loading files from session:', data.session.file_context);
            loadedFilesContent = [];
            let missingFiles = [];
            for (const fc of data.session.file_context) {
                console.log('Trying to load file:', fc.filepath);
                try {
                    const resp = await fetch('/api/file/read', { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({filepath: fc.filepath}) 
                    });
                    console.log('File read response:', resp.status);
                    const fileData = await resp.json();
                    console.log('File data:', fileData);
                    if (fileData.success) {
                        loadedFilesContent.push({ 
                            filename: fileData.filename, 
                            filepath: fileData.filepath, 
                            content: fileData.content,
                            included: true 
                        });
                        addLogEntry('INFO', 'Fil genindlæst', fileData.filename);
                    } else {
                        missingFiles.push(fc.filename || fc.filepath);
                    }
                } catch(e) {
                    console.log('Error loading file:', e);
                    missingFiles.push(fc.filename || fc.filepath);
                }
            }
            if (missingFiles.length > 0) {
                alert('Følgende filer fra sessionen blev ikke fundet og skal vælges igen:\n\n' + missingFiles.join('\n'));
                loadedFilesContent = [];
                selectedFiles = [];
                document.getElementById('filePathInput').value = '';
                document.getElementById('selectedFilesDisplay').innerHTML = '<div style="color:#ef4444;">Filer mangler - vælg venligst igen</div>';
            } else {
                const fileNames = loadedFilesContent.map(f => f.filename).join(', ');
                document.getElementById('selectedFilesDisplay').innerHTML = `<div style="color:#10b981;">📎 ${loadedFilesContent.length} fil(er) genindlæst: ${fileNames}</div>`;
                document.getElementById('filePathInput').value = loadedFilesContent.length === 1 ? loadedFilesContent[0].filename : `${loadedFilesContent.length} filer valgt`;
                if (loadedFilesContent.length > 0 && filePreviewEl) {
                    document.getElementById('fileSection').style.display = 'block';
                    document.getElementById('fileSectionToggle').textContent = '▼ Skjul filer';
                    readFiles();
                }
            }
        }
        
        addLogEntry('INFO', 'Session indlæst', data.session.name);
    }
}

async function saveCurrentSession() {
    if (!currentSessionId) {
        await createNewSession();
    }
    const layout = getCurrentLayout();
    const currentPrompt = document.getElementById('promptInput').value;
    const fileContext = loadedFilesContent.map(f => ({ filename: f.filename, filepath: f.filepath, content: f.content || '' }));
    const response = await fetch('/api/sessions/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            session_id: currentSessionId,
            name: currentPrompt.slice(0, 30) || 'Session',
            tree: currentTree,
            layout: layout,
            prompt_history: [],
            file_context: fileContext,
            original_prompt: currentPrompt,
            show_thinking: showThinking,
            lang: currentLang,
            template: document.getElementById('templateSelect').value
        })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', 'Session gemt', currentSessionId);
        refreshSessions();
    }
}

async function decompose() {
    const prompt = document.getElementById('promptInput').value;
    if (!prompt) {
        alert('Indtast en opgave');
        return;
    }
    
    const filesData = (loadedFilesContent || []).filter(f => f.included);
    console.log('Sending files to decompose:', filesData.length, filesData.map(f => f.filename));
    
    if (selectedFiles.length > 0 && loadedFilesContent.length === 0) {
        alert('Du har valgt filer men ikke læst dem endnu. Tryk først "📖 Læs fil" for at indlæse filindholdet.');
        return;
    }
    
    addLogEntry('INFO', 'Starter nedbrydning', prompt.slice(0, 50));
    if (filesData.length > 0) {
        addLogEntry('INFO', 'Inkluderer filer', `${filesData.length} fil(er)`);
    }
    
    const response = await fetch('/api/decompose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            prompt, 
            session_id: currentSessionId,
            show_thinking: showThinking,
            files: filesData,
            template: document.getElementById('templateSelect').value,
            lang: currentLang
        })
    });
    const data = await response.json();
    
    if (data.success) {
        currentTree = data.tree;
        currentSessionId = data.session_id;
        lastDecomposeTemplate = document.getElementById('templateSelect').value;
        updateTreeDisplay();
        await updatePromptHistory(currentSessionId);
        addLogEntry('INFO', 'Nedbrydning færdig', `${data.session_id}`);
        refreshSessions();
        await saveCurrentSession();
    } else {
        addLogEntry('ERROR', 'Nedbrydning fejlede', data.error);
    }
}

function stopStream() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    addLogEntry('INFO', 'Streaming stoppet', 'Af bruger');
}

async function resetExecution() {
    if (!currentTree) {
        alert('Intet opgavetræ at nulstille');
        return;
    }
    if (!confirm('Nulstil alle opgaver til "ikke udført"? Opgaverne forbliver i træet.')) return;
    
    await fetch('/api/reset-execution', { method: 'POST' });
    
    function resetStatus(node) {
        node.status = 'pending';
        node.result = null;
        if (node.children) {
            node.children.forEach(child => resetStatus(child));
        }
    }
    resetStatus(currentTree);
    
    updateTreeDisplay();
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', 'Opgavetræ nulstillet', '');
    
    if (currentSessionId) saveCurrentSession();
}

async function deleteTree() {
    if (!currentTree) {
        alert('Intet opgavetræ at slette');
        return;
    }
    if (!confirm('Er du sikker på at du vil slette hele opgavetræet?')) {
        return;
    }
    currentTree = null;
    await fetch('/api/reset-execution', { method: 'POST' });
    const treeContent = document.getElementById('treeContent');
    if (treeContent) treeContent.innerHTML = `<div style="color:#64748b;">${_('click_tree_hint')}</div>`;
    const llmContent = document.getElementById('llmContent');
    if (llmContent) llmContent.innerHTML = `<div style="color:#64748b;">${_('click_stream_hint')}</div>`;
    addLogEntry('INFO', 'Opgavetræ slettet', '');
    await saveCurrentSession();
}

let lastDecomposeTemplate = null;

async function executeWithStream() {
    const template = document.getElementById('templateSelect').value;
    if (!currentTree || (template !== 'fri' && template !== lastDecomposeTemplate)) {
        if (template !== 'fri') {
            await decompose();
            if (!currentTree) return;
        } else if (!currentTree) {
            alert('Nedbryd en opgave først');
            return;
        }
    }
    
    stopStream();
    
    const llmBox = document.getElementById('llmContent');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    const progressContainer = document.getElementById('progressContainer');
    if (progressContainer) progressContainer.style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', 'Kontekst modtaget', data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${_('N_tasks').replace('{n}', data.total_tasks)}</div>`;
                addLogEntry('INFO', _('streaming_started'), _('N_tasks').replace('{n}', data.total_tasks));
                break;
                
            case 'task_start':
                const currentTask = document.getElementById('currentTask');
                if (currentTask) currentTask.innerHTML = `📌 ${escapeHtml(data.task)} <span class="loading"></span>`;
                
                function markRunning(node) {
                    if (node.name === data.task) node.status = 'running';
                    if (node.children) node.children.forEach(markRunning);
                }
                if (currentTree) {
                    markRunning(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', _('task_started'), data.task);
                break;
                
            case 'progress_chunk':
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                const clean = currentOutputs[data.task].replace(/<think>[\s\S]*?<\/think>/g, '');
                if (showThinking) {
                    const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                    const outputDiv = document.getElementById(outputId);
                    if (outputDiv) {
                        outputDiv.textContent = clean;
                    }
                }
                if (llmBox) llmBox.scrollTop = llmBox.scrollHeight;
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                const taskElem = document.getElementById('currentTask');
                if (taskElem) taskElem.innerHTML = `<span style="color:#10b981;">✓ ${escapeHtml(data.task)} færdig</span>`;
                
                if (!showThinking && llmBox) {
                    const output = currentOutputs[data.task] || data.result || '';
                    const existing = llmBox.querySelector(`[data-task="${data.task}"]`);
                    if (existing) {
                        existing.innerHTML = `<strong style="color:#10b981;">✅ ${escapeHtml(data.task)}</strong><div style="white-space:pre-wrap;margin-top:5px;">${escapeHtml(output)}</div>`;
                    } else {
                        llmBox.innerHTML += `<div data-task="${data.task}" style="margin-bottom:15px;"><strong style="color:#10b981;">✅ ${escapeHtml(data.task)}</strong><div style="white-space:pre-wrap;margin-top:5px;">${escapeHtml(output)}</div></div>`;
                    }
                }
                
                function markDone(node) {
                    if (node.name === data.task) node.status = 'done';
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Opgave færdig', data.task);
                saveCurrentSession();
                break;
                
            case 'tool_call':
                addLogEntry('TOOL', `🔧 ${data.tool}`, JSON.stringify(data.args));
                break;
                
            case 'tool_result':
                const success = data.result?.success;
                const icon = success ? '✅' : '❌';
                addLogEntry(success ? 'TOOL' : 'ERROR', `${icon} ${data.tool}`, JSON.stringify(data.result).slice(0, 100));
                if (llmBox && success) {
                    llmBox.innerHTML += `<div style="color:#10b981; margin:5px 0; padding:5px; background:#1e293b; border-left:3px solid #10b981; font-size:12px;">${icon} <strong>${escapeHtml(data.tool)}</strong>: ${escapeHtml(data.result.result?.url || data.result.result?.output || 'OK').slice(0, 150)}</div>`;
                    llmBox.scrollTop = llmBox.scrollHeight;
                }
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:#10b981; margin-top: 15px;">${_('all_done')}</div>`;
                if (progressContainer) progressContainer.style.display = 'none';
                addLogEntry('INFO', _('stream_done'), _('all_executed'));
                saveCurrentSession();
                updatePromptHistory(currentSessionId);
                eventSource.close();
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:#ef4444;">❌ ${_('error_prefix')}${data.message}</div>`;
                addLogEntry('ERROR', _('stream_error'), data.message);
                eventSource.close();
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Genopretter...');
    };
}

function generateTreeMarkdown(node, level = 0) {
    if (!node) return '';
    
    const indent = '  '.repeat(level);
    const statusIcon = node.status === 'done' ? '✅' : (node.status === 'running' ? '🔄' : '⏳');
    let md = `${indent}- ${statusIcon} **${node.name}**\n`;
    
    if (node.children && node.children.length > 0) {
        for (const child of node.children) {
            md += generateTreeMarkdown(child, level + 1);
        }
    }
    
    return md;
}

async function exportToMarkdown() {
    if (!currentSessionId) {
        alert('Ingen aktiv session at eksportere');
        return;
    }
    
    const folderStatus = await fetch('/api/folder/status');
    const folderData = await folderStatus.json();
    const currentFolder = folderData.success ? folderData.folder : 'C:\\Dev\\Agenten\\exports';
    
    const chosenFolder = prompt('Gem rapport i mappe:\n(Klik OK for at bruge nuværende, eller indtast ny sti)', currentFolder);
    if (!chosenFolder) return;
    
    if (chosenFolder !== currentFolder) {
        await fetch('/api/folder/set', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({folder: chosenFolder}) });
        document.getElementById('folderStatus').innerHTML = `📁 Gemmer i: ${chosenFolder} <span class="folder-status">Aktiv</span>`;
    }
    
    addLogEntry('INFO', 'Eksporterer session til Markdown', currentSessionId);
    
    const response = await fetch(`/api/sessions/load/${currentSessionId}`);
    const data = await response.json();
    
    if (!data.success) {
        alert('Kunne ikke hente session data');
        return;
    }
    
    const session = data.session;
    const timestamp = new Date().toLocaleString();
    
let md = `${_('export_md_report_header')}\n\n`;
    md += `**Session ID:** ${session.id}\n`;
    md += `**Navn:** ${session.name}\n`;
    md += `**Oprettet:** ${session.created}\n`;
    md += `**Eksporteret:** ${timestamp}\n\n`;
    md += `---\n\n`;
    
    md += `${_('export_md_prompt')}\n\n`;
    md += `\`\`\`\n${session.original_prompt || _('export_md_no_prompt')}\n\`\`\`\n\n`;
    
    md += `${_('export_md_tree')}\n\n`;
    if (currentTree) {
        md += generateTreeMarkdown(currentTree);
    } else if (session.tree) {
        md += generateTreeMarkdown(session.tree);
    } else {
        md += `${_('export_md_no_tree')}\n\n`;
    }
    md += `\n`;
    
    md += `${_('export_md_llm')}\n\n`;
    const llmContent = document.getElementById('llmContent');
    if (llmContent && llmContent.innerText && llmContent.innerText !== 'Tryk "Udfør med streaming"' && llmContent.innerText !== _('click_stream_hint')) {
        md += `\`\`\`\n${llmContent.innerText}\n\`\`\`\n\n`;
    } else {
        md += `${_('export_md_no_llm')}\n\n`;
    }
    md += `\n`;
    
    md += `${_('export_md_log')}\n\n`;
    if (session.agent_log && session.agent_log.length > 0) {
        for (const log of session.agent_log) {
            const time = new Date(log.timestamp * 1000).toLocaleTimeString();
            md += `- **[${time}] ${log.level}:** ${log.message}`;
            if (log.detail) md += ` - ${log.detail}`;
            md += `\n`;
        }
        md += `\n`;
    } else {
        md += `${_('export_md_no_log')}\n\n`;
    }
    
    md += `${_('export_md_history')}\n\n`;
    if (session.prompt_history && session.prompt_history.length > 0) {
        for (let i = 0; i < session.prompt_history.length; i++) {
            const item = session.prompt_history[i];
            const time = new Date(item.timestamp).toLocaleTimeString();
            md += `### ${i + 1}. ${item.prompt}\n`;
            md += `- ${_('export_md_time')}${time}\n`;
            md += `- ${_('export_md_result')}\n`;
            md += `  \`\`\`\n  ${(item.result || _('export_md_no_result_yet')).slice(0, 500)}\n  \`\`\`\n`;
            if (item.tree) {
                md += `- ${_('export_md_treestructure')}\n`;
                md += `  \`\`\`\n  ${JSON.stringify(item.tree, null, 2).slice(0, 1000)}\n  \`\`\`\n`;
            }
            md += `\n`;
        }
    } else {
        md += `${_('export_md_no_prompts')}\n\n`;
    }
    
    md += `${_('export_md_knowledge')}\n\n`;
    if (session.learned_knowledge && session.learned_knowledge.length > 0) {
        for (const knowledge of session.learned_knowledge) {
            md += `- **[${knowledge.type}]** ${knowledge.content}\n`;
            md += `  - ${_('export_md_source')}${knowledge.source_prompt}\n`;
        }
        md += `\n`;
    } else {
        md += `${_('export_md_no_knowledge')}\n\n`;
    }
    
    md += `${_('export_md_layout')}\n\n`;
    if (session.layout) {
        md += `\`\`\`json\n${JSON.stringify(session.layout, null, 2)}\n\`\`\`\n\n`;
    }
    
    md += `${_('export_md_issues')}\n\n`;
    md += `${_('export_md_observations')}\n\n`;
    md += `- \n`;
    md += `- \n`;
    md += `- \n\n`;
    
    md += `---\n`;
    md += `${_('export_md_footer')}\n`;
    
    const filename = `agent_session_${currentSessionId}_${Date.now()}.md`;
    
    const saveResponse = await fetch('/api/folder/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filename, content: md, path: chosenFolder })
    });
    const saveData = await saveResponse.json();
    
    if (saveData.success) {
        addLogEntry('INFO', 'Eksporteret til mappe', saveData.filepath);
        alert(`✅ Fil gemt i:\n${saveData.filepath}`);
    } else {
        addLogEntry('WARNING', 'Kunne ikke gemme til mappe', saveData.error);
        // Fallback til download
        const blob = new Blob([md], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addLogEntry('INFO', 'Fil downloadet (fallback)', filename);
    }
}

    if (llmContent && llmContent !== _('click_stream_hint')) md += `${_('export_md_llm')}\n\n${llmContent}\n\n`;
    
    if (loadedFilesContent.length > 0) {
        md += `${_('file_included_section')}\n\n`;

            md += `### ${fc.filename}\n\n${_('file_included_path')}: \`${fc.filepath}\`\n\n`;
        }
    }
    
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `agenten_preview_${Date.now()}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    addLogEntry('INFO', 'Downloaded preview', a.download);
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    createPanels();
    refreshSessions();
    checkFolderStatus();
});
