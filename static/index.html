<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Agenten – Drag & Drop Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0f172a;
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 15px;
        }
        
        /* Header - fixed height */
        .header {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        
        h1 {
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Session bar */
        .session-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .session-select {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            color: #e2e8f0;
            flex: 1;
        }
        
        button {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover { background: #2563eb; }
        
        textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        
        /* Grid layout - CSS Grid baseret */
        .grid-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            min-height: 0;
            transition: all 0.1s ease;
        }
        
        /* Panel styling */
        .panel {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 100px;
            min-height: 100px;
        }
        
        .panel-header {
            background: #334155;
            padding: 10px 15px;
            cursor: grab;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .panel-header:active {
            cursor: grabbing;
        }
        
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: #e2e8f0;
        }
        
        .panel-controls {
            display: flex;
            gap: 8px;
        }
        
        .panel-controls button {
            background: #475569;
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        
        .panel-controls button:hover {
            background: #64748b;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        /* Resize handle */
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, #60a5fa 50%);
            border-radius: 0 0 12px 0;
            z-index: 10;
        }
        
        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, #a78bfa 50%);
        }
        
        /* Drag placeholder */
        .drag-placeholder {
            background: #3b82f6;
            opacity: 0.3;
            border-radius: 16px;
            transition: all 0.1s;
        }
        
        /* Tree styling */
        .tree-container, .llm-box, .log-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .tree-node-content {
            padding: 4px 8px;
            margin: 2px 0;
            background: #1e293b;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }
        
        .tree-children { margin-left: 20px; }
        
        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .status-pending { background: #f59e0b; color: #0f172a; }
        .status-running { background: #3b82f6; }
        .status-done { background: #10b981; }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-bar {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 16px;
            transition: width 0.3s;
        }
        
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-left: 2px solid;
            font-size: 11px;
        }
        
        .log-INFO { border-left-color: #60a5fa; color: #93c5fd; }
        .log-DEBUG { border-left-color: #64748b; color: #94a3b8; }
        .log-ERROR { border-left-color: #ef4444; color: #fca5a5; }
        .log-LLM { border-left-color: #a78bfa; color: #c4b5fd; }
        
        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Layout editor mode */
        .layout-editor .panel {
            border: 2px solid #60a5fa;
        }
        
        .drag-icon {
            cursor: grab;
            margin-right: 8px;
            opacity: 0.6;
        }
        
        .drag-icon:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🤖 Agenten – Drag & Drop Layout</h1>
        <p>🎯 Træk i <span style="background:#475569; padding:2px 6px; border-radius:4px;">⋮⋮</span> ikonet for at flytte • Træk i hjørnet for at resize</p>
        
        <div class="session-bar">
            <select id="sessionSelect" class="session-select">
                <option value="">-- Vælg eller opret ny session --</option>
            </select>
            <button onclick="createNewSession()">➕ Ny</button>
            <button onclick="loadSelectedSession()">📂 Indlæs</button>
            <button onclick="saveCurrentSession()">💾 Gem layout</button>
            <button onclick="resetLayout()">🔄 Reset layout</button>
        </div>
        
        <textarea id="promptInput" rows="2" placeholder="Indtast en opgave f.eks.:&#10;Hvordan ved jeg at 2 + 2 er 4?"></textarea>
        <div>
            <button onclick="decompose()">🌳 Nedbryd til træ</button>
            <button onclick="executeWithStream()" style="background:#10b981;">⚡ Udfør med streaming</button>
            <button onclick="stopStream()" style="background:#ef4444;">⏹️ Stop</button>
        </div>
    </div>
    
    <div class="grid-layout" id="gridLayout"></div>
</div>

<script>
// Panel definitioner
const panels = [
    { id: 'tree', title: '📁 Opgavetræ', defaultWidth: 1, defaultHeight: 1 },
    { id: 'llm', title: '📡 LLM Output', defaultWidth: 1, defaultHeight: 1 },
    { id: 'log', title: '📋 Agent Log', defaultWidth: 1, defaultHeight: 1 }
];

let currentSessionId = null;
let currentTree = null;
let eventSource = null;

let dragState = {
    active: false,
    panelId: null,
    startX: 0,
    startY: 0,
    startLeft: 0,
    startTop: 0,
    startMouseX: 0,
    startMouseY: 0,
    panel: null
};

let resizeState = {
    active: false,
    panelId: null,
    startX: 0,
    startY: 0,
    startWidth: 0,
    startHeight: 0,
    startColSpan: 0,
    startRowSpan: 0
};

// Grid configuration
let gridCols = 3;
let gridRows = 2;
let gridCells = [];

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addLogEntry(level, message, detail) {
    const logBox = document.getElementById('logContent');
    if (!logBox) return;
    const time = new Date().toLocaleTimeString();
    const logHtml = `<div class="log-entry log-${level}">
        <strong>[${time}] ${level}</strong>: ${escapeHtml(message)}<br>
        <span style="font-size: 10px; color: #64748b;">${escapeHtml(detail || '')}</span>
    </div>`;
    logBox.innerHTML += logHtml;
    logBox.scrollTop = logBox.scrollHeight;
}

function renderTree(node) {
    if (!node) return '';
    const statusClass = node.status === 'done' ? 'status-done' : (node.status === 'running' ? 'status-running' : 'status-pending');
    const statusText = node.status === 'done' ? '✓' : (node.status === 'running' ? '⏳' : '○');
    
    let html = `<div>
        <div class="tree-node-content">
            📌 ${escapeHtml(node.name)} <span class="task-status ${statusClass}">${statusText}</span>
        </div>`;
    
    if (node.children && node.children.length > 0) {
        html += `<div class="tree-children">`;
        for (const child of node.children) {
            html += renderTree(child);
        }
        html += `</div>`;
    }
    html += `</div>`;
    return html;
}

function updateTreeDisplay() {
    const treeContainer = document.getElementById('treeContent');
    if (treeContainer && currentTree) {
        treeContainer.innerHTML = renderTree(currentTree);
    } else if (treeContainer) {
        treeContainer.innerHTML = '<div style="color: #64748b;">Klik "Nedbryd til træ"</div>';
    }
}

function updateLogDisplay(logs) {
    const logBox = document.getElementById('logContent');
    if (!logBox) return;
    if (logs && logs.length > 0) {
        logBox.innerHTML = '';
        for (const log of logs) {
            const time = new Date(log.timestamp * 1000).toLocaleTimeString();
            logBox.innerHTML += `<div class="log-entry log-${log.level}">
                <strong>[${time}] ${log.level}</strong>: ${escapeHtml(log.message)}<br>
                <span style="font-size: 10px;">${escapeHtml(log.detail || '')}</span>
            </div>`;
        }
    }
}

// Initialize grid layout
function initGridLayout() {
    const container = document.getElementById('gridLayout');
    container.innerHTML = '';
    
    // Brug CSS Grid med template areas
    container.style.display = 'grid';
    container.style.gridTemplateColumns = '1fr 1fr 1fr';
    container.style.gridTemplateRows = '1fr 1fr';
    container.style.gap = '15px';
    
    // Opret paneler
    const panelConfigs = [
        { id: 'tree', title: '📁 Opgavetræ', area: 'tree', col: 0, row: 0, colSpan: 1, rowSpan: 1 },
        { id: 'llm', title: '📡 LLM Output', area: 'llm', col: 1, row: 0, colSpan: 1, rowSpan: 1 },
        { id: 'log', title: '📋 Agent Log', area: 'log', col: 2, row: 0, colSpan: 1, rowSpan: 1 }
    ];
    
    for (const config of panelConfigs) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = `panel-${config.id}`;
        panel.setAttribute('data-panel-id', config.id);
        panel.style.gridColumn = `${config.col + 1} / span ${config.colSpan}`;
        panel.style.gridRow = `${config.row + 1} / span ${config.rowSpan}`;
        
        panel.innerHTML = `
            <div class="panel-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="drag-icon" style="cursor: grab;">⋮⋮</span>
                    <h3>${config.title}</h3>
                </div>
                <div class="panel-controls">
                    <button onclick="toggleMinimize('${config.id}')">−</button>
                    <button onclick="removePanel('${config.id}')">×</button>
                </div>
            </div>
            <div class="panel-content" id="${config.id}Content">
                <div style="color: #64748b;">Indhold for ${config.title}</div>
            </div>
            <div class="resize-handle"></div>
        `;
        
        container.appendChild(panel);
        
        // Tilføj indhold
        const contentDiv = document.getElementById(`${config.id}Content`);
        if (config.id === 'tree') {
            contentDiv.innerHTML = '<div id="treeContent" class="tree-container"><div style="color: #64748b;">Klik "Nedbryd til træ"</div></div>';
        } else if (config.id === 'llm') {
            contentDiv.innerHTML = `
                <div id="progressContainer" style="display: none;">
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                    <div id="currentTask" style="margin-bottom: 8px; font-size: 12px;"></div>
                </div>
                <div id="llmContent" class="llm-box"><div style="color: #64748b;">Tryk "Udfør med streaming"</div></div>
            `;
        } else if (config.id === 'log') {
            contentDiv.innerHTML = '<div id="logContent" class="log-box"><div style="color: #64748b;">Logger venter på aktivitet...</div></div>';
        }
    }
    
    setupDragAndDrop();
    setupResize();
}

function setupDragAndDrop() {
    const dragIcons = document.querySelectorAll('.drag-icon');
    
    dragIcons.forEach(icon => {
        icon.addEventListener('mousedown', startDrag);
    });
}

function startDrag(e) {
    const dragIcon = e.target.closest('.drag-icon');
    if (!dragIcon) return;
    
    const panel = dragIcon.closest('.panel');
    if (!panel) return;
    
    e.preventDefault();
    e.stopPropagation();
    
    const rect = panel.getBoundingClientRect();
    const container = document.getElementById('gridLayout');
    const containerRect = container.getBoundingClientRect();
    
    // Gem start positioner
    dragState = {
        active: true,
        panelId: panel.getAttribute('data-panel-id'),
        startX: rect.left - containerRect.left,
        startY: rect.top - containerRect.top,
        startMouseX: e.clientX,
        startMouseY: e.clientY,
        startWidth: rect.width,
        startHeight: rect.height,
        panel: panel,
        containerRect: containerRect
    };
    
    // Skift til absolute positioning midlertidigt
    const originalPosition = window.getComputedStyle(panel).position;
    const originalMargin = window.getComputedStyle(panel).margin;
    
    panel.style.position = 'absolute';
    panel.style.margin = '0';
    panel.style.left = `${dragState.startX}px`;
    panel.style.top = `${dragState.startY}px`;
    panel.style.width = `${rect.width}px`;
    panel.style.height = `${rect.height}px`;
    panel.style.zIndex = '1000';
    panel.style.cursor = 'grabbing';
    
    // Gem original styles til restore
    dragState.originalPosition = originalPosition;
    dragState.originalMargin = originalMargin;
    
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
    if (!dragState.active) return;
    e.preventDefault();
    
    const deltaX = e.clientX - dragState.startMouseX;
    const deltaY = e.clientY - dragState.startMouseY;
    
    let newLeft = dragState.startX + deltaX;
    let newTop = dragState.startY + deltaY;
    
    // Begræns til container (ingen hop)
    const maxLeft = dragState.containerRect.width - dragState.startWidth;
    const maxTop = dragState.containerRect.height - dragState.startHeight;
    
    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));
    
    dragState.panel.style.left = `${newLeft}px`;
    dragState.panel.style.top = `${newTop}px`;
}

function stopDrag(e) {
    if (!dragState.active) return;
    
    // Returner til grid layout
    dragState.panel.style.position = '';
    dragState.panel.style.margin = '';
    dragState.panel.style.left = '';
    dragState.panel.style.top = '';
    dragState.panel.style.width = '';
    dragState.panel.style.height = '';
    dragState.panel.style.zIndex = '';
    dragState.panel.style.cursor = '';
    
    dragState.active = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    
    saveLayoutToSession();
}

function setupResize() {
    const resizeHandles = document.querySelectorAll('.resize-handle');
    
    resizeHandles.forEach(handle => {
        handle.addEventListener('mousedown', startResize);
    });
}

function startResize(e) {
    const panel = e.target.closest('.panel');
    if (!panel) return;
    
    const panelId = panel.getAttribute('data-panel-id');
    const rect = panel.getBoundingClientRect();
    const gridContainer = document.getElementById('gridLayout');
    const gridRect = gridContainer.getBoundingClientRect();
    
    // Find current grid position
    const colWidth = gridRect.width / gridCols;
    const rowHeight = gridRect.height / gridRows;
    
    resizeState = {
        active: true,
        panelId: panelId,
        startX: e.clientX,
        startY: e.clientY,
        startWidth: rect.width,
        startHeight: rect.height,
        startColSpan: Math.round(rect.width / colWidth),
        startRowSpan: Math.round(rect.height / rowHeight),
        panel: panel
    };
    
    document.addEventListener('mousemove', onResize);
    document.addEventListener('mouseup', stopResize);
    e.preventDefault();
    e.stopPropagation();
}

function onResize(e) {
    if (!resizeState.active) return;
    
    const deltaX = e.clientX - resizeState.startX;
    const deltaY = e.clientY - resizeState.startY;
    
    let newWidth = Math.max(200, resizeState.startWidth + deltaX);
    let newHeight = Math.max(150, resizeState.startHeight + deltaY);
    
    const gridContainer = document.getElementById('gridLayout');
    const gridRect = gridContainer.getBoundingClientRect();
    
    // Begræns til container
    newWidth = Math.min(newWidth, gridRect.width - 20);
    newHeight = Math.min(newHeight, gridRect.height - 20);
    
    resizeState.panel.style.width = `${newWidth}px`;
    resizeState.panel.style.height = `${newHeight}px`;
}

function stopResize(e) {
    if (!resizeState.active) return;
    
    resizeState.active = false;
    document.removeEventListener('mousemove', onResize);
    document.removeEventListener('mouseup', stopResize);
    
    saveLayoutToSession();
}

function toggleMinimize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const content = panel.querySelector('.panel-content');
    const btn = panel.querySelector('.panel-controls button:first-child');
    
    if (content.style.display === 'none') {
        content.style.display = '';
        btn.textContent = '−';
    } else {
        content.style.display = 'none';
        btn.textContent = '+';
    }
    saveLayoutToSession();
}

function removePanel(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    if (panel) {
        panel.style.display = 'none';
        saveLayoutToSession();
    }
}

function getCurrentLayout() {
    const layout = {};
    for (const panel of panels) {
        const element = document.getElementById(`panel-${panel.id}`);
        if (element) {
            layout[panel.id] = {
                display: element.style.display !== 'none',
                width: element.style.width,
                height: element.style.height,
                left: element.style.left,
                top: element.style.top,
                minimized: element.querySelector('.panel-content')?.style.display === 'none'
            };
        }
    }
    return layout;
}

async function saveLayoutToSession() {
    if (!currentSessionId) return;
    const layout = getCurrentLayout();
    const response = await fetch('/api/sessions/save-layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, layout: layout })
    });
}

function resetLayout() {
    for (const panel of panels) {
        const element = document.getElementById(`panel-${panel.id}`);
        if (element) {
            element.style.display = '';
            element.style.width = '';
            element.style.height = '';
            element.style.left = '';
            element.style.top = '';
            element.style.position = '';
            const content = element.querySelector('.panel-content');
            if (content) content.style.display = '';
            const btn = element.querySelector('.panel-controls button:first-child');
            if (btn) btn.textContent = '−';
        }
    }
    saveLayoutToSession();
}

function applyLayout(layout) {
    if (!layout) return;
    for (const panelId in layout) {
        const element = document.getElementById(`panel-${panelId}`);
        if (element && layout[panelId]) {
            element.style.display = layout[panelId].display ? '' : 'none';
            if (layout[panelId].width) element.style.width = layout[panelId].width;
            if (layout[panelId].height) element.style.height = layout[panelId].height;
            if (layout[panelId].minimized) {
                const content = element.querySelector('.panel-content');
                if (content) content.style.display = 'none';
                const btn = element.querySelector('.panel-controls button:first-child');
                if (btn) btn.textContent = '+';
            }
        }
    }
}

// Session management
async function refreshSessions() {
    const response = await fetch('/api/sessions');
    const data = await response.json();
    if (data.success) {
        const select = document.getElementById('sessionSelect');
        select.innerHTML = '<option value="">-- Vælg eller opret ny session --</option>';
        for (const session of data.sessions) {
            select.innerHTML += `<option value="${session.id}">${escapeHtml(session.name)} (${session.task_count} opgaver)</option>`;
        }
    }
}

async function createNewSession() {
    const name = prompt('Navn på ny session:', `Session ${new Date().toLocaleTimeString()}`);
    if (name) {
        const response = await fetch('/api/sessions/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (data.success) {
            currentSessionId = data.session_id;
            addLogEntry('INFO', 'Ny session oprettet', `${name} (${data.session_id})`);
            refreshSessions();
            resetLayout();
        }
    }
}

async function loadSelectedSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert('Vælg en session');
        return;
    }
    const response = await fetch(`/api/sessions/load/${sessionId}`);
    const data = await response.json();
    if (data.success) {
        currentSessionId = sessionId;
        
        // Load layout
        if (data.session.layout) {
            applyLayout(data.session.layout);
        }
        
        // Load tree
        if (data.session.tree) {
            currentTree = data.session.tree;
            updateTreeDisplay();
        }
        
        // Load log
        if (data.session.agent_log) {
            updateLogDisplay(data.session.agent_log);
        }
        
        addLogEntry('INFO', 'Session indlæst', data.session.name);
    }
}

async function saveCurrentSession() {
    if (!currentSessionId) {
        await createNewSession();
    }
    const layout = getCurrentLayout();
    const response = await fetch('/api/sessions/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            session_id: currentSessionId,
            name: document.getElementById('promptInput').value.slice(0, 30),
            tree: currentTree,
            layout: layout
        })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', 'Session gemt', currentSessionId);
        refreshSessions();
    }
}

// Agent functions
async function decompose() {
    const prompt = document.getElementById('promptInput').value;
    if (!prompt) {
        alert('Indtast en opgave');
        return;
    }
    
    addLogEntry('INFO', 'Starter nedbrydning', prompt.slice(0, 50));
    
    const response = await fetch('/api/decompose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, session_id: currentSessionId })
    });
    const data = await response.json();
    
    if (data.success) {
        currentTree = data.tree;
        currentSessionId = data.session_id;
        updateTreeDisplay();
        addLogEntry('INFO', 'Nedbrydning færdig', `${data.session_id}`);
        
        if (data.log) {
            for (const log of data.log) {
                addLogEntry(log.level, log.message, log.detail);
            }
        }
        refreshSessions();
        await saveCurrentSession();
    } else {
        addLogEntry('ERROR', 'Nedbrydning fejlede', data.error);
    }
}

function stopStream() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    addLogEntry('INFO', 'Streaming stoppet', 'Af bruger');
}

function executeWithStream() {
    if (!currentTree) {
        alert('Nedbryd en opgave først');
        return;
    }
    
    stopStream();
    
    const llmBox = document.getElementById('llmContent');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    document.getElementById('progressContainer').style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', 'Kontekst modtaget', data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${data.total_tasks} opgaver</div>`;
                addLogEntry('INFO', 'Streaming startet', `${data.total_tasks} opgaver`);
                break;
                
            case 'task_start':
                if (llmBox) {
                    const currentTask = document.getElementById('currentTask');
                    if (currentTask) currentTask.innerHTML = `📌 ${escapeHtml(data.task)} <span class="loading"></span>`;
                }
                function markRunning(node) {
                    if (node.name === data.task) node.status = 'running';
                    if (node.children) node.children.forEach(markRunning);
                }
                if (currentTree) {
                    markRunning(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Påbegynder opgave', data.task);
                break;
                
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                const outputDiv = document.getElementById(outputId);
                if (outputDiv) {
                    outputDiv.innerHTML = escapeHtml(currentOutputs[data.task]);
                }
                if (llmBox) llmBox.scrollTop = llmBox.scrollHeight;
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                const currentTask = document.getElementById('currentTask');
                if (currentTask) currentTask.innerHTML = `<span style="color:#10b981;">✓ ${escapeHtml(data.task)} færdig</span>`;
                function markDone(node) {
                    if (node.name === data.task) node.status = 'done';
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Opgave færdig', data.task);
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:#10b981; margin-top: 15px;">✅ Alle opgaver færdige!</div>`;
                document.getElementById('progressContainer').style.display = 'none';
                addLogEntry('INFO', 'Streaming færdig', 'Alle opgaver udført');
                saveCurrentSession();
                eventSource.close();
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:#ef4444;">❌ Fejl: ${data.message}</div>`;
                addLogEntry('ERROR', 'Streaming fejl', data.message);
                eventSource.close();
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Forsøger at genoprette...');
    };
}

// Initialize on load
document.addEventListener('DOMContentLoaded', function() {
    initGridLayout();
    refreshSessions();
});
</script>
