<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Agenten – Frit layout med overlappende vinduer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', system-ui;
            background: #0f172a;
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 15px;
        }
        
        .header {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        
        h1 {
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .session-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .session-select {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            color: #e2e8f0;
            flex: 1;
        }
        
        button {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover { background: #2563eb; }
        
        textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        
        .canvas-container {
            flex: 1;
            position: relative;
            background: #0f172a;
            border-radius: 16px;
            overflow: auto;
            min-height: 0;
        }
        
        .panel {
            position: absolute;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            min-width: 200px;
            min-height: 150px;
        }
        
        .panel.dragging {
            opacity: 0.8;
            cursor: grabbing;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        
        .panel-header {
            background: #334155;
            padding: 10px 15px;
            cursor: grab;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .panel-header:active {
            cursor: grabbing;
        }
        
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            color: #e2e8f0;
        }
        
        .drag-icon {
            cursor: grab;
            margin-right: 8px;
            opacity: 0.6;
            font-size: 16px;
        }
        
        .drag-icon:active {
            cursor: grabbing;
        }
        
        .panel-controls {
            display: flex;
            gap: 8px;
        }
        
        .panel-controls button {
            background: #475569;
            border: none;
            padding: 2px 8px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        
        .panel-controls button:hover {
            background: #64748b;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nw-resize;
            background: linear-gradient(135deg, transparent 50%, #60a5fa 50%);
            border-radius: 0 0 12px 0;
            z-index: 10;
        }
        
        .resize-handle:hover {
            background: linear-gradient(135deg, transparent 50%, #a78bfa 50%);
        }
        
        .tree-container, .llm-box, .log-box, .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .tree-node-content {
            padding: 4px 8px;
            margin: 2px 0;
            background: #1e293b;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }
        
        .tree-children { margin-left: 20px; }
        
        .task-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            margin-left: 8px;
        }
        
        .status-pending { background: #f59e0b; color: #0f172a; }
        .status-running { background: #3b82f6; }
        .status-done { background: #10b981; }
        
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3b82f6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-bar {
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            background: #3b82f6;
            width: 0%;
            height: 16px;
            transition: width 0.3s;
        }
        
        .log-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-left: 2px solid;
            font-size: 11px;
        }
        
        .log-INFO { border-left-color: #60a5fa; color: #93c5fd; }
        .log-DEBUG { border-left-color: #64748b; color: #94a3b8; }
        .log-ERROR { border-left-color: #ef4444; color: #fca5a5; }
        .log-LLM { border-left-color: #a78bfa; color: #c4b5fd; }
        
        .history-item {
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
            border-left: 3px solid #60a5fa;
        }
        
        .history-prompt {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 5px;
        }
        
        .history-result {
            font-size: 11px;
            color: #93c5fd;
            margin-top: 5px;
        }
        
        .reuse-btn {
            margin-top: 5px;
            font-size: 10px;
            padding: 2px 8px;
            background: #475569;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🤖 Agenten – Frit layout med overlappende vinduer</h1>
        <p>🎯 Træk i ⋮⋮ ikonet • Træk i hjørnet for resize • Vinduer kan overlappe</p>
        
        <div class="session-bar">
            <select id="sessionSelect" class="session-select">
                <option value="">-- Vælg eller opret ny session --</option>
            </select>
            <button onclick="createNewSession()">➕ Ny</button>
            <button onclick="loadSelectedSession()">📂 Indlæs</button>
            <button onclick="saveCurrentSession()">💾 Gem layout</button>
            <button onclick="resetLayout()">🔄 Reset layout</button>
        </div>
        
        <textarea id="promptInput" rows="2" placeholder="Indtast en opgave f.eks.:&#10;Hvordan ved jeg at 2 + 2 er 4?"></textarea>
        <div>
            <button onclick="decompose()">🌳 Nedbryd til træ</button>
            <button onclick="executeWithStream()" style="background:#10b981;">⚡ Udfør med streaming</button>
            <button onclick="stopStream()" style="background:#ef4444;">⏹️ Stop</button>
        </div>
    </div>
    
    <div class="canvas-container" id="canvasContainer"></div>
</div>

<script>
// Panel definitioner med alle 4 paneler
const panelDefinitions = [
    { id: 'tree', title: '📁 Opgavetræ', defaultLeft: 20, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'llm', title: '📡 LLM Output', defaultLeft: 440, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'log', title: '📋 Agent Log', defaultLeft: 860, defaultTop: 20, defaultWidth: 400, defaultHeight: 300 },
    { id: 'history', title: '📜 Prompt Historik', defaultLeft: 20, defaultTop: 340, defaultWidth: 1240, defaultHeight: 200 }
];

let currentSessionId = null;
let currentTree = null;
let eventSource = null;
let panels = {};

// Drag state
let dragState = {
    active: false,
    panelId: null,
    startMouseX: 0,
    startMouseY: 0,
    startLeft: 0,
    startTop: 0
};

// Resize state
let resizeState = {
    active: false,
    panelId: null,
    startMouseX: 0,
    startMouseY: 0,
    startWidth: 0,
    startHeight: 0
};

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function addLogEntry(level, message, detail) {
    const logBox = document.getElementById('logContent');
    if (!logBox) return;
    const time = new Date().toLocaleTimeString();
    const logHtml = `<div class="log-entry log-${level}">
        <strong>[${time}] ${level}</strong>: ${escapeHtml(message)}<br>
        <span style="font-size: 10px; color: #64748b;">${escapeHtml(detail || '')}</span>
    </div>`;
    logBox.innerHTML += logHtml;
    logBox.scrollTop = logBox.scrollHeight;
}

function renderTree(node) {
    if (!node) return '';
    const statusClass = node.status === 'done' ? 'status-done' : (node.status === 'running' ? 'status-running' : 'status-pending');
    const statusText = node.status === 'done' ? '✓' : (node.status === 'running' ? '⏳' : '○');
    
    let html = `<div>
        <div class="tree-node-content">
            📌 ${escapeHtml(node.name)} <span class="task-status ${statusClass}">${statusText}</span>
        </div>`;
    
    if (node.children && node.children.length > 0) {
        html += `<div class="tree-children">`;
        for (const child of node.children) {
            html += renderTree(child);
        }
        html += `</div>`;
    }
    html += `</div>`;
    return html;
}

function updateTreeDisplay() {
    const treeContainer = document.getElementById('treeContent');
    if (treeContainer && currentTree) {
        treeContainer.innerHTML = renderTree(currentTree);
    }
}

async function updatePromptHistory(sessionId) {
    const historyContainer = document.getElementById('historyContent');
    if (!historyContainer) return;
    
    try {
        const response = await fetch(`/api/sessions/prompts/${sessionId}`);
        const data = await response.json();
        
        if (data.success && data.prompts && data.prompts.length > 0) {
            historyContainer.innerHTML = '';
            for (const item of data.prompts.slice().reverse()) { // Nyeste først
                const time = new Date(item.timestamp).toLocaleTimeString();
                const promptShort = item.prompt.length > 60 ? item.prompt.slice(0, 60) + '...' : item.prompt;
                const resultShort = item.result ? (item.result.length > 100 ? item.result.slice(0, 100) + '...' : item.result) : 'Ingen resultat endnu';
                
                historyContainer.innerHTML += `
                    <div class="history-item">
                        <div class="history-prompt">
                            📝 ${escapeHtml(promptShort)}
                            <span style="font-size: 10px; color: #64748b; float: right;">${time}</span>
                        </div>
                        <div class="history-result">
                            💡 Resultat: ${escapeHtml(resultShort)}
                        </div>
                        <button class="reuse-btn" onclick="reusePrompt('${escapeHtml(item.prompt).replace(/'/g, "\\'")}')">🔄 Genbrug denne prompt</button>
                    </div>
                `;
            }
        } else {
            historyContainer.innerHTML = '<div style="color: #64748b;">Ingen prompts endnu. Skriv en opgave og klik "Nedbryd til træ"</div>';
        }
    } catch (e) {
        console.error('Failed to load history:', e);
        historyContainer.innerHTML = '<div style="color: #ef4444;">Fejl ved indlæsning af historik</div>';
    }
}

function reusePrompt(prompt) {
    document.getElementById('promptInput').value = prompt;
    addLogEntry('INFO', 'Genbruger tidligere prompt', prompt.slice(0, 50));
    decompose();
}

function bringToFront(panelId) {
    const container = document.getElementById('canvasContainer');
    const panels_list = container.querySelectorAll('.panel');
    let maxZ = 0;
    panels_list.forEach(p => {
        const z = parseInt(p.style.zIndex) || 0;
        if (z > maxZ) maxZ = z;
    });
    const panel = document.getElementById(`panel-${panelId}`);
    if (panel) {
        panel.style.zIndex = maxZ + 1;
    }
}

function createPanels() {
    const container = document.getElementById('canvasContainer');
    container.innerHTML = '';
    panels = {};
    
    for (const def of panelDefinitions) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.id = `panel-${def.id}`;
        panel.setAttribute('data-panel-id', def.id);
        panel.style.left = `${def.defaultLeft}px`;
        panel.style.top = `${def.defaultTop}px`;
        panel.style.width = `${def.defaultWidth}px`;
        panel.style.height = `${def.defaultHeight}px`;
        panel.style.zIndex = '1';
        
        panel.innerHTML = `
            <div class="panel-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="drag-icon">⋮⋮</span>
                    <h3>${def.title}</h3>
                </div>
                <div class="panel-controls">
                    <button onclick="toggleMinimize('${def.id}')">−</button>
                    <button onclick="removePanel('${def.id}')">×</button>
                </div>
            </div>
            <div class="panel-content" id="${def.id}Content">
                <div style="color: #64748b;">Indhold for ${def.title}</div>
            </div>
            <div class="resize-handle"></div>
        `;
        
        container.appendChild(panel);
        panels[def.id] = panel;
        
        // Add content based on type
        const contentDiv = document.getElementById(`${def.id}Content`);
        if (def.id === 'tree') {
            contentDiv.innerHTML = '<div id="treeContent" class="tree-container"><div style="color: #64748b;">Klik "Nedbryd til træ"</div></div>';
        } else if (def.id === 'llm') {
            contentDiv.innerHTML = `
                <div id="progressContainer" style="display: none;">
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                    <div id="currentTask" style="margin-bottom: 8px; font-size: 12px;"></div>
                </div>
                <div id="llmContent" class="llm-box"><div style="color: #64748b;">Tryk "Udfør med streaming"</div></div>
            `;
        } else if (def.id === 'log') {
            contentDiv.innerHTML = '<div id="logContent" class="log-box"><div style="color: #64748b;">Logger venter på aktivitet...</div></div>';
        } else if (def.id === 'history') {
            contentDiv.innerHTML = '<div id="historyContent" class="history-box"><div style="color: #64748b;">Vælg en session for at se prompt historik</div></div>';
        }
    }
    
    setupDragAndDrop();
    setupResize();
}

function setupDragAndDrop() {
    const dragIcons = document.querySelectorAll('.drag-icon');
    
    dragIcons.forEach(icon => {
        icon.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = icon.closest('.panel');
            if (!panel) return;
            
            const panelId = panel.getAttribute('data-panel-id');
            bringToFront(panelId);
            
            const rect = panel.getBoundingClientRect();
            const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
            
            dragState = {
                active: true,
                panelId: panelId,
                startMouseX: e.clientX,
                startMouseY: e.clientY,
                startLeft: rect.left - containerRect.left,
                startTop: rect.top - containerRect.top,
                startWidth: rect.width,
                startHeight: rect.height
            };
            
            panel.classList.add('dragging');
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        });
    });
}

function onDrag(e) {
    if (!dragState.active) return;
    e.preventDefault();
    
    const deltaX = e.clientX - dragState.startMouseX;
    const deltaY = e.clientY - dragState.startMouseY;
    
    let newLeft = dragState.startLeft + deltaX;
    let newTop = dragState.startTop + deltaY;
    
    const container = document.getElementById('canvasContainer');
    const containerRect = container.getBoundingClientRect();
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    
    newLeft = Math.max(-dragState.startWidth + 50, Math.min(newLeft, containerRect.width - 50));
    newTop = Math.max(-dragState.startHeight + 50, Math.min(newTop, containerRect.height - 50));
    
    panel.style.left = `${newLeft}px`;
    panel.style.top = `${newTop}px`;
}

function stopDrag(e) {
    if (!dragState.active) return;
    
    const panel = document.getElementById(`panel-${dragState.panelId}`);
    if (panel) {
        panel.classList.remove('dragging');
    }
    
    dragState.active = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    
    saveLayoutToSession();
}

function setupResize() {
    const resizeHandles = document.querySelectorAll('.resize-handle');
    
    resizeHandles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            
            const panel = handle.closest('.panel');
            if (!panel) return;
            
            const panelId = panel.getAttribute('data-panel-id');
            bringToFront(panelId);
            
            const rect = panel.getBoundingClientRect();
            
            resizeState = {
                active: true,
                panelId: panelId,
                startMouseX: e.clientX,
                startMouseY: e.clientY,
                startWidth: rect.width,
                startHeight: rect.height
            };
            
            document.addEventListener('mousemove', onResize);
            document.addEventListener('mouseup', stopResize);
        });
    });
}

function onResize(e) {
    if (!resizeState.active) return;
    e.preventDefault();
    
    const deltaX = e.clientX - resizeState.startMouseX;
    const deltaY = e.clientY - resizeState.startMouseY;
    
    let newWidth = Math.max(200, resizeState.startWidth + deltaX);
    let newHeight = Math.max(150, resizeState.startHeight + deltaY);
    
    const container = document.getElementById('canvasContainer');
    const containerRect = container.getBoundingClientRect();
    const panel = document.getElementById(`panel-${resizeState.panelId}`);
    const panelRect = panel.getBoundingClientRect();
    
    newWidth = Math.min(newWidth, containerRect.width - (panelRect.left - containerRect.left) - 20);
    newHeight = Math.min(newHeight, containerRect.height - (panelRect.top - containerRect.top) - 20);
    
    panel.style.width = `${newWidth}px`;
    panel.style.height = `${newHeight}px`;
}

function stopResize(e) {
    if (!resizeState.active) return;
    
    resizeState.active = false;
    document.removeEventListener('mousemove', onResize);
    document.removeEventListener('mouseup', stopResize);
    
    saveLayoutToSession();
}

function toggleMinimize(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    const content = panel.querySelector('.panel-content');
    const btn = panel.querySelector('.panel-controls button:first-child');
    
    if (content.style.display === 'none') {
        content.style.display = '';
        btn.textContent = '−';
        const savedHeight = panel.getAttribute('data-saved-height');
        if (savedHeight) {
            panel.style.height = savedHeight;
            panel.removeAttribute('data-saved-height');
        }
    } else {
        panel.setAttribute('data-saved-height', panel.style.height);
        content.style.display = 'none';
        btn.textContent = '+';
        panel.style.height = 'auto';
    }
    saveLayoutToSession();
}

function removePanel(panelId) {
    const panel = document.getElementById(`panel-${panelId}`);
    if (panel) {
        panel.style.display = 'none';
        saveLayoutToSession();
    }
}

function getCurrentLayout() {
    const layout = {};
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel && panel.style.display !== 'none') {
            layout[def.id] = {
                left: panel.style.left,
                top: panel.style.top,
                width: panel.style.width,
                height: panel.style.height,
                minimized: panel.querySelector('.panel-content')?.style.display === 'none'
            };
        }
    }
    return layout;
}

function applyLayout(layout) {
    if (!layout) return;
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel && layout[def.id]) {
            const l = layout[def.id];
            if (l.left) panel.style.left = l.left;
            if (l.top) panel.style.top = l.top;
            if (l.width) panel.style.width = l.width;
            if (l.height) panel.style.height = l.height;
            if (l.minimized) {
                const content = panel.querySelector('.panel-content');
                const btn = panel.querySelector('.panel-controls button:first-child');
                if (content) content.style.display = 'none';
                if (btn) btn.textContent = '+';
            }
        }
    }
}

async function saveLayoutToSession() {
    if (!currentSessionId) return;
    const layout = getCurrentLayout();
    await fetch('/api/sessions/save-layout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: currentSessionId, layout: layout })
    });
}

function resetLayout() {
    for (const def of panelDefinitions) {
        const panel = document.getElementById(`panel-${def.id}`);
        if (panel) {
            panel.style.display = '';
            panel.style.left = `${def.defaultLeft}px`;
            panel.style.top = `${def.defaultTop}px`;
            panel.style.width = `${def.defaultWidth}px`;
            panel.style.height = `${def.defaultHeight}px`;
            const content = panel.querySelector('.panel-content');
            if (content) content.style.display = '';
            const btn = panel.querySelector('.panel-controls button:first-child');
            if (btn) btn.textContent = '−';
        }
    }
    saveLayoutToSession();
}

// Session management
async function refreshSessions() {
    const response = await fetch('/api/sessions');
    const data = await response.json();
    if (data.success) {
        const select = document.getElementById('sessionSelect');
        select.innerHTML = '<option value="">-- Vælg eller opret ny session --</option>';
        for (const session of data.sessions) {
            select.innerHTML += `<option value="${session.id}">${escapeHtml(session.name)} (${session.prompt_count || 0} prompts)</option>`;
        }
    }
}

async function createNewSession() {
    const name = prompt('Navn på ny session:', `Session ${new Date().toLocaleTimeString()}`);
    if (name) {
        const response = await fetch('/api/sessions/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        const data = await response.json();
        if (data.success) {
            currentSessionId = data.session_id;
            addLogEntry('INFO', 'Ny session oprettet', `${name} (${data.session_id})`);
            refreshSessions();
            resetLayout();
            await updatePromptHistory(currentSessionId);
        }
    }
}

async function loadSelectedSession() {
    const select = document.getElementById('sessionSelect');
    const sessionId = select.value;
    if (!sessionId) {
        alert('Vælg en session');
        return;
    }
    const response = await fetch(`/api/sessions/load/${sessionId}`);
    const data = await response.json();
    if (data.success) {
        currentSessionId = sessionId;
        
        if (data.session.layout) {
            applyLayout(data.session.layout);
        }
        
        if (data.session.tree) {
            currentTree = data.session.tree;
            updateTreeDisplay();
        }
        
        if (data.session.agent_log) {
            const logBox = document.getElementById('logContent');
            if (logBox) {
                logBox.innerHTML = '';
                for (const log of data.session.agent_log) {
                    const time = new Date(log.timestamp * 1000).toLocaleTimeString();
                    logBox.innerHTML += `<div class="log-entry log-${log.level}">
                        <strong>[${time}] ${log.level}</strong>: ${escapeHtml(log.message)}<br>
                        <span style="font-size: 10px;">${escapeHtml(log.detail || '')}</span>
                    </div>`;
                }
            }
        }
        
        await updatePromptHistory(sessionId);
        addLogEntry('INFO', 'Session indlæst', data.session.name);
    }
}

async function saveCurrentSession() {
    if (!currentSessionId) {
        await createNewSession();
    }
    const layout = getCurrentLayout();
    const response = await fetch('/api/sessions/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            session_id: currentSessionId,
            name: document.getElementById('promptInput').value.slice(0, 30) || 'Session',
            tree: currentTree,
            layout: layout,
            prompt_history: []  // Will be merged server-side
        })
    });
    const data = await response.json();
    if (data.success) {
        addLogEntry('INFO', 'Session gemt', currentSessionId);
        refreshSessions();
    }
}

// Agent functions
async function decompose() {
    const prompt = document.getElementById('promptInput').value;
    if (!prompt) {
        alert('Indtast en opgave');
        return;
    }
    
    addLogEntry('INFO', 'Starter nedbrydning', prompt.slice(0, 50));
    
    const response = await fetch('/api/decompose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, session_id: currentSessionId })
    });
    const data = await response.json();
    
    if (data.success) {
        currentTree = data.tree;
        currentSessionId = data.session_id;
        updateTreeDisplay();
        await updatePromptHistory(currentSessionId);
        addLogEntry('INFO', 'Nedbrydning færdig', `${data.session_id}`);
        refreshSessions();
        await saveCurrentSession();
    } else {
        addLogEntry('ERROR', 'Nedbrydning fejlede', data.error);
    }
}

function stopStream() {
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    addLogEntry('INFO', 'Streaming stoppet', 'Af bruger');
}

function executeWithStream() {
    if (!currentTree) {
        alert('Nedbryd en opgave først');
        return;
    }
    
    stopStream();
    
    const llmBox = document.getElementById('llmContent');
    if (llmBox) llmBox.innerHTML = '<div class="loading"></div> Forbinder til streaming...';
    const progressContainer = document.getElementById('progressContainer');
    if (progressContainer) progressContainer.style.display = 'block';
    
    eventSource = new EventSource('/api/execute-stream');
    let currentOutputs = {};
    
    eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        
        switch(data.type) {
            case 'context':
                addLogEntry('INFO', 'Kontekst modtaget', data.original_prompt?.slice(0, 50));
                break;
                
            case 'log':
                addLogEntry(data.log.level, data.log.message, data.log.detail);
                break;
                
            case 'start':
                if (llmBox) llmBox.innerHTML = `<div style="color:#60a5fa;">🎬 ${data.total_tasks} opgaver</div>`;
                addLogEntry('INFO', 'Streaming startet', `${data.total_tasks} opgaver`);
                break;
                
            case 'task_start':
                const currentTask = document.getElementById('currentTask');
                if (currentTask) currentTask.innerHTML = `📌 ${escapeHtml(data.task)} <span class="loading"></span>`;
                
                function markRunning(node) {
                    if (node.name === data.task) node.status = 'running';
                    if (node.children) node.children.forEach(markRunning);
                }
                if (currentTree) {
                    markRunning(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Påbegynder opgave', data.task);
                break;
                
            case 'llm_chunk':
                if (!currentOutputs[data.task]) {
                    currentOutputs[data.task] = '';
                    if (llmBox) {
                        llmBox.innerHTML += `<div style="margin-bottom: 15px;">
                            <strong style="color:#a78bfa;">💭 ${escapeHtml(data.task)}</strong>
                            <div id="output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}" style="white-space: pre-wrap; margin-top: 5px;"></div>
                        </div>`;
                    }
                }
                currentOutputs[data.task] += data.chunk;
                const outputId = `output-${escapeHtml(data.task).replace(/[^a-zA-Z0-9]/g, '_')}`;
                const outputDiv = document.getElementById(outputId);
                if (outputDiv) {
                    outputDiv.innerHTML = escapeHtml(currentOutputs[data.task]);
                }
                if (llmBox) llmBox.scrollTop = llmBox.scrollHeight;
                break;
                
            case 'progress':
                const fill = document.getElementById('progressFill');
                if (fill) fill.style.width = `${data.progress}%`;
                break;
                
            case 'task_done':
                const taskElem = document.getElementById('currentTask');
                if (taskElem) taskElem.innerHTML = `<span style="color:#10b981;">✓ ${escapeHtml(data.task)} færdig</span>`;
                
                function markDone(node) {
                    if (node.name === data.task) node.status = 'done';
                    if (node.children) node.children.forEach(markDone);
                }
                if (currentTree) {
                    markDone(currentTree);
                    updateTreeDisplay();
                }
                addLogEntry('INFO', 'Opgave færdig', data.task);
                saveCurrentSession();
                break;
                
            case 'complete':
                if (llmBox) llmBox.innerHTML += `<div style="color:#10b981; margin-top: 15px;">✅ Alle opgaver færdige!</div>`;
                if (progressContainer) progressContainer.style.display = 'none';
                addLogEntry('INFO', 'Streaming færdig', 'Alle opgaver udført');
                saveCurrentSession();
                updatePromptHistory(currentSessionId);
                eventSource.close();
                break;
                
            case 'error':
                if (llmBox) llmBox.innerHTML += `<div style="color:#ef4444;">❌ Fejl: ${data.message}</div>`;
                addLogEntry('ERROR', 'Streaming fejl', data.message);
                eventSource.close();
                break;
        }
    };
    
    eventSource.onerror = function() {
        addLogEntry('ERROR', 'Forbindelse tabt', 'Genopretter...');
    };
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    createPanels();
    refreshSessions();
});
</script>
